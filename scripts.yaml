door_service_toggle:
  alias: Roller Door - Service Toggle
  description: 'Open/close the front roller door for service staff. Enables service
    mode (bypasses auto-close) when opening; disables it when closing.

    '
  icon: mdi:garage
  sequence:
  - if:
    - condition: state
      entity_id: input_boolean.door_service_mode
      state: 'off'
    then:
    - action: shell_command.c4_lock_door
    - delay: 00:00:01
    - action: shell_command.c4_unlock_door
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.door_service_mode
    else:
    - action: shell_command.c4_lock_door
    - delay: 00:00:01
    - action: shell_command.c4_unlock_door
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.door_service_mode
  mode: single
