reconcile_bay_door_codes:
  alias: Reconcile Bay Door Codes
  description: 'Single source of truth for one bay''s 3 keypad slots. Reads the lane
    calendar, builds the desired set of door codes (bookings from coach T-45 / customer
    T-30 before start, through end+15min grace), then forces slots a/b/c to exactly
    match that set: clears stale/duplicate/ended codes, loads missing ones. Calendar
    codes take priority; any code listed in input_text.door_code_exempt that is currently
    present in this bay is also kept (manual standing codes). Idempotent. Replaces
    the old activate + deactivate + catch-all.'
  mode: queued
  max: 6
  fields:
    cal:
      description: Lane calendar entity_id
    sa:
      description: Slot A input_text entity_id
    sb:
      description: Slot B input_text entity_id
    sc:
      description: Slot C input_text entity_id
    c4a:
      description: Control4 slot number for A
    c4b:
      description: Control4 slot number for B
    c4c:
      description: Control4 slot number for C
  sequence:
  - action: calendar.get_events
    target:
      entity_id: '{{ cal }}'
    data:
      start_date_time: '{{ (now() - timedelta(minutes=30)).isoformat() }}'
      end_date_time: '{{ (now() + timedelta(minutes=45)).isoformat() }}'
    response_variable: evsraw
  - variables:
      desired: '{% set ns = namespace(items=[], codes=[]) %}{% set events = (evsraw.get(cal)
        or {}).get(''events'', []) %}{% for e in events %}{% set desc = e.get(''description'')
        or '''' %}{% set code = desc | regex_findall(''DOOR CODE: ([\d ]+)'') | first
        | default('''') | replace('' '', '''') | trim %}{% set name = desc | regex_findall(''Customer:
        (.+)'') | first | default(''Guest'') | trim %}{% set lead = 45 if ''Coach
        Session'' in desc else 30 %}{% set sstr = e.get(''start'') | string %}{% set
        estr = e.get(''end'') | string %}{% if code != '''' and code not in ns.codes
        and ''T'' in sstr and ''T'' in estr %}{% set st = as_datetime(sstr) %}{% set
        en = as_datetime(estr) %}{% if st is not none and en is not none and now()
        >= (st - timedelta(minutes=lead)) and now() <= (en + timedelta(minutes=15))
        %}{% set ns.items = ns.items + [code ~ '':'' ~ name] %}{% set ns.codes = ns.codes
        + [code] %}{% endif %}{% endif %}{% endfor %}{% set slotcodes = [ states(sa).split('':'')[0],
        states(sb).split('':'')[0], states(sc).split('':'')[0] ] %}{% set exraw =
        states(''input_text.door_code_exempt'') %}{% set exlist = (exraw if exraw
        not in [''unknown'',''unavailable'',''None''] else '''').split('','') %}{%
        for ent in exlist %}{% set ent2 = ent | trim %}{% set ecode = (ent2.split('':'')[0])
        | trim %}{% if ent2 != '''' and ecode != '''' and ecode in slotcodes and ecode
        not in ns.codes %}{% set ns.items = ns.items + [ent2] %}{% set ns.codes =
        ns.codes + [ecode] %}{% endif %}{% endfor %}{{ ns.items[:3] }}'
      target_a: '{{ desired[0] if (desired | length) > 0 else '''' }}'
      target_b: '{{ desired[1] if (desired | length) > 1 else '''' }}'
      target_c: '{{ desired[2] if (desired | length) > 2 else '''' }}'
  - repeat:
      for_each: '{{ [ {''e'': sa, ''c4'': c4a, ''t'': target_a}, {''e'': sb, ''c4'':
        c4b, ''t'': target_b}, {''e'': sc, ''c4'': c4c, ''t'': target_c} ] }}'
      sequence:
      - choose:
        - conditions:
          - '{{ states(repeat.item.e) != repeat.item.t }}'
          sequence:
          - choose:
            - conditions:
              - '{{ repeat.item.t == '''' }}'
              sequence:
              - action: shell_command.c4_clear_code
                data:
                  slot: '{{ repeat.item.c4 }}'
              - action: input_text.set_value
                target:
                  entity_id: '{{ repeat.item.e }}'
                data:
                  value: ''
            default:
            - action: shell_command.c4_set_code
              data:
                slot: '{{ repeat.item.c4 }}'
                code: '{{ repeat.item.t.split('':'')[0] }}'
                name: '{{ repeat.item.t.split('':'')[1] if '':'' in repeat.item.t
                  else ''Guest'' }}'
            - action: input_text.set_value
              target:
                entity_id: '{{ repeat.item.e }}'
              data:
                value: '{{ repeat.item.t }}'
team_door_open_short:
  alias: Team Door - Open & Stop Short
  description: Pulses the roller-door OPERATE relay to open, waits 17.5s, then pulses
    again to STOP the door just short of fully open - this prevents the operator's
    30s auto-close from arming, so the door stays open. Used by the team-booking auto-door.
    Assumes the door is CLOSED when called. Pulse = lock.unlock on lock.front_door_lock
    (same OPERATE actuator as normal entry). Built 2026-07-07.
  icon: mdi:door-sliding-open
  mode: single
  sequence:
  - action: lock.unlock
    target:
      entity_id: lock.front_door_lock
  - delay:
      seconds: 17
      milliseconds: 500
  - action: lock.unlock
    target:
      entity_id: lock.front_door_lock
reconcile_highbay_lights:
  alias: Reconcile Highbay Lights (to bookings)
  description: 'Re-derives every highbay''s correct state from the bay helpers + day/night
    + busy mode and sets each on/off to match. Fixes highbay light drift after a Control4
    dropout: during a C4 outage the calendar bay start/end automations still set the
    HA-side bay helpers correctly, but their C4 light commands are lost - this re-applies
    the right lights when C4 returns. Desired hbN = busy-mode OR its own bay booked
    OR (dark AND a neighbour lane booked); hb3 also stays on whenever dark (night
    residual). Built 2026-07-09.'
  icon: mdi:wall-sconce-flat
  mode: single
  sequence:
  - variables:
      dark: '{{ is_state(''sun.sun'',''below_horizon'') or (is_state(''sun.sun'',''above_horizon'')
        and (as_timestamp(state_attr(''sun.sun'',''next_setting'')) - as_timestamp(now()))
        < 1800) }}'
  - if:
    - condition: template
      value_template: '{{ is_state(''input_boolean.lighting_all_lanes_active'',''on'')
        or is_state(''input_boolean.bay1_helper'',''on'') or ((dark|bool) and is_state(''input_boolean.bay2_helper'',''on''))
        }}'
    then:
    - action: light.turn_on
      target:
        entity_id: light.highbay_1
    else:
    - action: light.turn_off
      target:
        entity_id: light.highbay_1
  - if:
    - condition: template
      value_template: '{{ is_state(''input_boolean.lighting_all_lanes_active'',''on'')
        or is_state(''input_boolean.bay2_helper'',''on'') or ((dark|bool) and (is_state(''input_boolean.bay1_helper'',''on'')
        or is_state(''input_boolean.bay3_helper'',''on''))) }}'
    then:
    - action: light.turn_on
      target:
        entity_id: light.highbay_2
    else:
    - action: light.turn_off
      target:
        entity_id: light.highbay_2
  - if:
    - condition: template
      value_template: '{{ is_state(''input_boolean.lighting_all_lanes_active'',''on'')
        or is_state(''input_boolean.bay3_helper'',''on'') or (dark|bool) }}'
    then:
    - action: light.turn_on
      target:
        entity_id: light.highbay_3
    else:
    - action: light.turn_off
      target:
        entity_id: light.highbay_3
  - if:
    - condition: template
      value_template: '{{ is_state(''input_boolean.lighting_all_lanes_active'',''on'')
        or is_state(''input_boolean.bay4_helper'',''on'') or ((dark|bool) and (is_state(''input_boolean.bay3_helper'',''on'')
        or is_state(''input_boolean.bay5_helper'',''on''))) }}'
    then:
    - action: light.turn_on
      target:
        entity_id: light.highbay_4
    else:
    - action: light.turn_off
      target:
        entity_id: light.highbay_4
  - if:
    - condition: template
      value_template: '{{ is_state(''input_boolean.lighting_all_lanes_active'',''on'')
        or is_state(''input_boolean.bay5_helper'',''on'') or ((dark|bool) and is_state(''input_boolean.bay4_helper'',''on''))
        }}'
    then:
    - action: light.turn_on
      target:
        entity_id: light.highbay_5
    else:
    - action: light.turn_off
      target:
        entity_id: light.highbay_5
team_door_open_for_duration:
  alias: Team Door - Open For Duration (ad-hoc)
  description: Ad-hoc club/team door open from the REVO dashboard. Reads input_number.team_door_open_minutes,
    sets input_datetime.team_door_close_at = now + that many minutes, turns on input_boolean.team_door_hold
    (suppresses roller-door alerts + the 3-min auto-close-retry), then opens via script.team_door_open_short
    (open + stop-short so the operator's 30s auto-close stays disarmed). The per-minute
    'Team Booking - Auto-Close Door' automation shuts it and clears the hold at close_at.
    Built 2026-07-11.
  mode: single
  icon: mdi:door-sliding-open
  sequence:
  - action: input_datetime.set_datetime
    target:
      entity_id: input_datetime.team_door_close_at
    data:
      datetime: '{{ (now() + timedelta(minutes=(states(''input_number.team_door_open_minutes'')
        | int(60)))).strftime(''%Y-%m-%d %H:%M:%S'') }}'
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.team_door_hold
  - action: logbook.log
    data:
      name: Team Door
      message: Ad-hoc open for {{ states('input_number.team_door_open_minutes') |
        int(60) }} min (close at {{ states('input_datetime.team_door_close_at') }}).
      entity_id: input_boolean.team_door_hold
  - action: script.team_door_open_short
team_door_close_now:
  alias: Team Door - Close Now
  description: 'Manually end a club/team door hold from the REVO dashboard: if the
    roller door is open, pulse it closed; clear input_boolean.team_door_hold (restores
    roller-door alerts). Mirrors the ''Team Booking - Auto-Close Door'' automation.
    Built 2026-07-11.'
  mode: single
  icon: mdi:door-sliding
  sequence:
  - if:
    - condition: state
      entity_id: binary_sensor.roller_door_contact
      state: 'on'
    then:
    - action: lock.unlock
      target:
        entity_id: lock.front_door_lock
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.team_door_hold
  - action: logbook.log
    data:
      name: Team Door
      message: Manual close from dashboard - hold cleared, alerts restored.
      entity_id: input_boolean.team_door_hold
