- id: '1780070397691'
  alias: Lanes - Activate Neighbour Highbays on Bay Start
  description: 'When any bay_helper turns ON, immediately turn on the adjacent (neighbour)
    highbays: Bay 1 -> hb2 | Bay 2 -> hb1,hb3 | Bay 3 -> hb2,hb4 | Bay 4 -> hb3,hb5
    | Bay 5 -> hb4. Idempotent - turning on an already-on light has no effect. 2026-08-04
    (Inspector): night-only gate REMOVED - the Lane-3-style neighbour rule now applies
    to every lane ALL DAY, so any booking lights its own lane plus the adjacent lanes.
    Off side = neighbour-aware guards in the bay END automations + Highbays - Clear
    Stranded Neighbour Lights; the every-minute reconcile carries the same mapping
    as self-heal.'
  triggers:
  - trigger: state
    entity_id:
    - input_boolean.bay1_helper
    - input_boolean.bay2_helper
    - input_boolean.bay3_helper
    - input_boolean.bay4_helper
    - input_boolean.bay5_helper
