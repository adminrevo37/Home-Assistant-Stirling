        value_template: '{{ trigger.entity_id == ''input_boolean.bay1_helper'' }}'
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.highbay_2
    - conditions:
      - condition: template
        value_template: '{{ trigger.entity_id == ''input_boolean.bay2_helper'' }}'
      sequence:
      - action: light.turn_on
        target:
          entity_id:
          - light.highbay_1
          - light.highbay_3
    - conditions:
      - condition: template
        value_template: '{{ trigger.entity_id == ''input_boolean.bay3_helper'' }}'
      sequence:
      - action: light.turn_on
        target:
          entity_id:
          - light.highbay_2
          - light.highbay_4
    - conditions:
      - condition: template
        value_template: '{{ trigger.entity_id == ''input_boolean.bay4_helper'' }}'
      sequence:
      - action: light.turn_on
        target:
          entity_id:
          - light.highbay_3
          - light.highbay_5
    - conditions:
      - condition: template
        value_template: '{{ trigger.entity_id == ''input_boolean.bay5_helper'' }}'
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.highbay_4
  mode: parallel
  max: 5
- id: '1780149350644'
  alias: Common Lights - On (Front Door Opened)
  description: 'Front door unlocked (booking code entry / exit button) -> turn on
    common lights. Primary arrival trigger; occupancy>threshold is the backstop. NOTE:
    assumes a DS3 code entry surfaces as lock.front_door_lock -> unlocked; verify
    on-site. | DAYLIGHT GATE 2026-08-04 (Inspector): now carries the SAME gate as
    the occupancy automation - in daylight it only fires inside a booking''s lead-in/lead-out
    window (a bay helper on = booking start-11min through end+10min). Inspector''s
    rule: during the day the common lights come on ONLY for a booking, or manually
    via the HA app / Control4 panel (manual control is never blocked - this automation
    only governs automatic turn-on). After dark the gate is bypassed: any door open
    lights the building. This closes the 2026-08-03 deliberate exception where door-open
    was left ungated as a safety net.'
  triggers:
  - trigger: state
    entity_id: lock.front_door_lock
    to: unlocked
  conditions:
  - condition: or
    alias: After dark, OR inside a booking's lead-in/lead-out window
    conditions:
    - condition: state
      entity_id: sun.sun
      state: below_horizon
    - condition: state
      entity_id: input_boolean.bay1_helper
      state: 'on'
    - condition: state
      entity_id: input_boolean.bay2_helper
      state: 'on'
    - condition: state
      entity_id: input_boolean.bay3_helper
      state: 'on'
    - condition: state
      entity_id: input_boolean.bay4_helper
      state: 'on'
    - condition: state
      entity_id: input_boolean.bay5_helper
      state: 'on'
  actions:
  - action: light.turn_on
    target:
      entity_id:
      - light.inside_wall_lights
      - light.fluro_x_4
      - light.mezzanine_wall_lights
  mode: single
- id: '1780149352883'
  alias: Common Lights - On (Occupancy Rises)
  description: 'Occupancy rises above the configured threshold -> ensure common lights
    on. Backstop to the door-open arrival trigger. | DAYLIGHT GATE 2026-08-03 (Inspector):
    in DAYLIGHT this now only fires inside a booking window - i.e. a bay helper is
    on, which spans booking start-11min through end+10min (the same lead-in/lead-out
    the lane highbays use). Outside that window during the day the building is naturally
    lit and occupancy (staff, passing movement, camera motion) must NOT switch the
    common lights on. After dark (sun below horizon) the gate is bypassed and any
    occupancy still lights the building - never leave someone in a dark facility.
    NOTE: automation.common_lights_on_front_door_opened is deliberately NOT gated,
    so a real arrival through the front door always lights the building even on a
    gloomy day with no booking.'
  triggers:
  - trigger: numeric_state
    entity_id: sensor.main_occupancy_probability
    above: input_number.lighting_occupancy_threshold
  conditions:
  - condition: or
    alias: After dark, OR inside a booking's lead-in/lead-out window
    conditions:
    - condition: state
      entity_id: sun.sun
      state: below_horizon
    - condition: state
      entity_id: input_boolean.bay1_helper
      state: 'on'
    - condition: state
      entity_id: input_boolean.bay2_helper
      state: 'on'
    - condition: state
      entity_id: input_boolean.bay3_helper
      state: 'on'
    - condition: state
      entity_id: input_boolean.bay4_helper
      state: 'on'
    - condition: state
      entity_id: input_boolean.bay5_helper
      state: 'on'
  actions:
  - action: light.turn_on
    target:
      entity_id:
      - light.inside_wall_lights
      - light.fluro_x_4
      - light.mezzanine_wall_lights
  mode: single
- id: '1780149356921'
  alias: Common Lights - Off (Empty + No Booking)
  description: Occupancy at/below threshold AND no active booking AND no booking starting
    within the pre-booking protect window -> turn off common lights. Re-checking (debounced
    threshold-cross + every 5 min) catches an already-empty building. Booking-active
    guard + pre-booking window guard keep common lights on for an early-arriving customer
    who has sat still (occupancy decays).
  triggers:
  - entity_id: sensor.main_occupancy_probability
    below: input_number.lighting_occupancy_threshold
    for:
      minutes: '{{ states(''input_number.lighting_common_off_debounce_min'') | int(4)
        }}'
    platform: numeric_state
  - minutes: /5
    platform: time_pattern
  conditions:
  - condition: numeric_state
    entity_id: sensor.main_occupancy_probability
    below: input_number.lighting_occupancy_threshold
  - condition: state
    entity_id:
    - calendar.lane_1_bowling_machine
    - calendar.lane_2_bowling_machine
    - calendar.lane_3_truman_or_bowling_machine
    - calendar.lane_4_run_up_net
    - calendar.lane_5_run_up_net
    state: 'off'
  - condition: template
    alias: No booking starts within the pre-booking protect window
    value_template: '{% set win = states(''input_number.lighting_pre_booking_protect_window_min'')
      | int(30) %}{% set cals = [''calendar.lane_1_bowling_machine'',''calendar.lane_2_bowling_machine'',''calendar.lane_3_truman_or_bowling_machine'',''calendar.lane_4_run_up_net'',''calendar.lane_5_run_up_net'']
      %}{% set ns = namespace(imminent=false) %}{% for c in cals %}{% set st = state_attr(c,
      ''start_time'') %}{% if st is not none %}{% set secs = as_timestamp(as_datetime(st))
      - as_timestamp(now()) %}{% if secs > 0 and secs <= (win * 60) %}{% set ns.imminent
      = true %}{% endif %}{% endif %}{% endfor %}{{ not ns.imminent }}'
  actions:
  - action: light.turn_off
    target:
      entity_id:
      - light.inside_wall_lights
      - light.fluro_x_4
      - light.mezzanine_wall_lights
  mode: single
- id: '1780149360935'
  alias: Lighting - End-of-Day Hard Off (after last booking)
  description: SUPERSEDED/DISABLED 2026-06-02. Highbays REMOVED from this automation
    - bay lights now follow calendar only (per-bay START/END) + the 23:00 Absolute
    All-Off Catch-All; they are never occupancy-controlled. This now targets COMMON
    lights only and is redundant with 'Common Lights - Off' (kept disabled as a backstop).
    Pre-booking protect guard added so it is safe if ever re-enabled. Recommend deletion
    after review.
  triggers:
  - entity_id:
    - calendar.lane_1_bowling_machine
    - calendar.lane_2_bowling_machine
    - calendar.lane_3_truman_or_bowling_machine
    - calendar.lane_4_run_up_net
    - calendar.lane_5_run_up_net
    to: 'off'
    for:
      minutes: '{{ states(''input_number.lighting_endofday_delay_min'') | int(30)
        }}'
    platform: state
  - platform: time_pattern
    minutes: /5
  conditions:
  - condition: state
    entity_id:
    - calendar.lane_1_bowling_machine
    - calendar.lane_2_bowling_machine
    - calendar.lane_3_truman_or_bowling_machine
    - calendar.lane_4_run_up_net
    - calendar.lane_5_run_up_net
    state: 'off'
  - condition: numeric_state
    entity_id: sensor.main_occupancy_probability
    below: input_number.lighting_occupancy_threshold
  - condition: template
    alias: No booking starts within the pre-booking protect window
    value_template: '{% set win = states(''input_number.lighting_pre_booking_protect_window_min'')
      | int(30) %}{% set cals = [''calendar.lane_1_bowling_machine'',''calendar.lane_2_bowling_machine'',''calendar.lane_3_truman_or_bowling_machine'',''calendar.lane_4_run_up_net'',''calendar.lane_5_run_up_net'']
      %}{% set ns = namespace(imminent=false) %}{% for c in cals %}{% set st = state_attr(c,
      ''start_time'') %}{% if st is not none %}{% set secs = as_timestamp(as_datetime(st))
      - as_timestamp(now()) %}{% if secs > 0 and secs <= (win * 60) %}{% set ns.imminent
      = true %}{% endif %}{% endif %}{% endfor %}{{ not ns.imminent }}'
  actions:
  - action: light.turn_off
    target:
      entity_id:
      - light.inside_wall_lights
      - light.fluro_x_4
      - light.mezzanine_wall_lights
  mode: single
- id: '1780149364218'
  alias: Lighting - Absolute All-Off Catch-All
  description: 'Absolute backstop: at the configured catch-all time (input_datetime.lighting_hard_off_catchall)
    force all highbays + common lights off. Covers zero-booking days and any night
    the dynamic hard-off did not arm. Active-booking GUARD - if any lane calendar
    is still ''on'' (a live session) it SKIPS the force-off and logs. GATED on input_boolean.control4_ready
    (added 2026-07-28): skips while a power-outage boot recovery is in progress so
    it can''t kill the fail-bright lights.'
  triggers:
  - trigger: time
    at: input_datetime.lighting_hard_off_catchall
  conditions:
  - condition: state
    entity_id: input_boolean.control4_ready
    state: 'on'
  actions:
  - if:
    - condition: state
      entity_id:
      - calendar.lane_1_bowling_machine
      - calendar.lane_2_bowling_machine
      - calendar.lane_3_truman_or_bowling_machine
      - calendar.lane_4_run_up_net
      - calendar.lane_5_run_up_net
      state: 'off'
    then:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.lighting_all_lanes_active
    - action: light.turn_off
      target:
        entity_id:
        - light.highbay_1
        - light.highbay_2
        - light.highbay_3
        - light.highbay_4
        - light.highbay_5
        - light.inside_wall_lights
        - light.fluro_x_4
        - light.mezzanine_wall_lights
    else:
    - action: logbook.log
      data:
        name: Lighting Catch-All
        message: Absolute all-off SKIPPED - a lane booking is still active (after-hours
          session). Lights left on; bay-end / night-shutdown will clear them after
          it ends.
        entity_id: input_datetime.lighting_hard_off_catchall
  mode: single
- id: '1780149365937'
  alias: Office Lights - Scheduled Off Sweep
  description: At the three configured times (default 18:00/20:00/22:00) turn off
    office downlights - catches staff leaving them on. Default hard-off (no occupancy
    guard; binary_sensor.pier_facing_office_all_occupancy available if a guard is
    wanted later).
  triggers:
  - trigger: time
