    is_customer: '{{ ''Net Session'' in (trigger.calendar_event.description | default(''''))
      }}'
    plugs_to_on: '{% set d = trigger.calendar_event.description | default('''') %}{%
      set is_coach = ''Coach Session'' in d %}{% set is_customer = ''Net Session''
      in d %}{% set tl = states(''input_select.truman_location'') %}{% set here =
      tl in [''Lane 3 Left'',''Lane 3 Right''] %}{% set paid = ''(Truman)'' in d %}{%
      if (not here) or is_coach or (is_customer and paid) %}switch.lane_3_left,switch.lane_3_right{%
      else %}{{ ''switch.lane_3_right'' if tl == ''Lane 3 Left'' else ''switch.lane_3_left''
      }}{% endif %}'
- id: '1781854318155'
  alias: Bowling Machines - Reconcile to bookings (outage/restart safety)
  description: 'Fail-safe: re-syncs the 3 lanes'' machine plugs to the booking schedule
    after a power outage, HA restart, or a plug reconnecting to Zigbee. Per lane:
    a booking active or starting within ~11 min -> both plugs ON; otherwise -> OFF.
    Covers an outage spanning a booking start (HA missed the -10 trigger), a Zigbee
    coordinator reboot, and plugging a plug in mid-session (auto-powers it if its
    lane is booked now). Complements the plugs'' power-outage-memory=''restore''.
    20s debounce after the trigger to let integrations settle / collapse the burst
    of reconnects. Built 2026-06-18 -> SPEC_ZIGBEE_BOWLING_MACHINE_POWER_2026-06.'
  triggers:
  - trigger: homeassistant
    event: start
  - trigger: state
    entity_id:
    - switch.lane_1_left
    - switch.lane_1_right
    - switch.lane_2_left
    - switch.lane_2_right
    - switch.lane_3_left
    - switch.lane_3_right
    from: unavailable
  actions:
  - delay: 00:00:20
  - repeat:
      for_each: '{{ lanes }}'
      sequence:
      - action: calendar.get_events
        target:
          entity_id: '{{ repeat.item.cal }}'
        data:
          start_date_time: '{{ (now() - timedelta(minutes=1)).isoformat() }}'
          end_date_time: '{{ (now() + timedelta(minutes=11)).isoformat() }}'
        response_variable: ev
      - if:
        - '{{ (ev[repeat.item.cal].events | default([])) | count > 0 }}'
        then:
        - action: switch.turn_on
          target:
            entity_id: '{{ repeat.item.plugs | join('','') }}'
        else:
        - action: switch.turn_off
          target:
            entity_id: '{{ repeat.item.plugs | join('','') }}'
  mode: restart
  variables:
    lanes:
    - cal: calendar.lane_1_bowling_machine
      plugs:
      - switch.lane_1_left
      - switch.lane_1_right
    - cal: calendar.lane_2_bowling_machine
      plugs:
      - switch.lane_2_left
      - switch.lane_2_right
    - cal: calendar.lane_3_truman_or_bowling_machine
      plugs:
      - switch.lane_3_left
      - switch.lane_3_right
- id: '1782097005885'
  alias: Power Outage Recovery — Fail-Bright
  description: 'Fires on every HA start (power outage or restart). FAIL-BRIGHT: waits
    until Control4 is controllable (highbay entities leave ''unavailable''; passes
    instantly on a normal restart), then blasts ALL lane + common lights ON so customers
    can use the facility immediately, holds ~3 min, then reconciles lights to bookings
    and hands back to normal automations. If Control4 is still stuck ''unavailable''
    after 5 min, escalates to ONE guarded full HA restart (input_boolean.power_recovery_restart_done
    prevents a boot loop). input_boolean.control4_ready is held OFF during recovery
    so the reconcile/shutdown automations self-suppress (no manual mass-disable needed).
    Replaces the old blind 3-min-delay-then-reload recovery. Built 2026-07-28.'
  triggers:
  - trigger: homeassistant
    event: start
  actions:
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.control4_ready
  - wait_template: '{{ states(''light.highbay_1'') not in [''unavailable'',''unknown'']
      and states(''light.highbay_3'') not in [''unavailable'',''unknown''] }}'
    timeout: 00:05:00
    continue_on_timeout: true
  - choose:
    - conditions:
      - '{{ wait.completed }}'
      sequence:
      - repeat:
          count: 3
          sequence:
          - action: light.turn_on
            continue_on_error: true
            target:
              entity_id:
              - light.highbay_1
              - light.highbay_2
              - light.highbay_3
              - light.highbay_4
              - light.highbay_5
              - light.inside_wall_lights
              - light.mezzanine_wall_lights
              - light.fluro_x_4
          - delay: 00:00:05
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.power_recovery_restart_done
      - action: notify.mobile_app_julian
        data:
          title: Power restored — all lights ON
          message: Control4 recovered. All lane + common lights forced ON so customers
            can use the facility now. Reconciling to bookings in 3 min.
      - delay: 00:03:00
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.control4_ready
      - action: script.reconcile_highbay_lights
      - action: notify.mobile_app_julian
        data:
          title: Recovery complete
          message: Lights reconciled to current bookings. Normal control resumed.
    default:
    - choose:
      - conditions:
        - '{{ is_state(''input_boolean.power_recovery_restart_done'',''off'') }}'
        sequence:
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.power_recovery_restart_done
        - action: notify.mobile_app_julian
          data:
            title: Control4 didn't recover — restarting HA
            message: Control4 still unavailable 5 min after power restore. Restarting
              HA once to clear a stuck integration.
        - delay: 00:00:03
        - action: homeassistant.restart
      default:
      - action: light.turn_on
        continue_on_error: true
        target:
          entity_id:
          - light.highbay_1
          - light.highbay_2
          - light.highbay_3
          - light.highbay_4
          - light.highbay_5
          - light.inside_wall_lights
          - light.mezzanine_wall_lights
          - light.fluro_x_4
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.control4_ready
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.power_recovery_restart_done
      - action: notify.mobile_app_julian
        data:
          title: ⚠️ Control4 STILL down after auto-restart
          message: Control4 did not recover even after an HA restart. Check the Director
            (192.168.1.107) + network switch. Tried to force lights on regardless.
  mode: restart
- id: door_code_reconcile_allbays
  alias: Door Code Reconcile - Every Minute (all bays)
  description: 'Single source of truth for all 5 bays'' keypad slots. Every minute,
    runs script.reconcile_bay_door_codes per bay: forces each bay''s 3 slots to exactly
    match the calendar''s desired door codes (coach T-45 / customer T-30 before start
    through end+15min grace) - loads missing, clears stale/ended/duplicate. Replaces
    bay_N_door_code_activate + bay_N_door_code_deactivate + door_code_catch_all_every_minute
    (all disabled 2026-06-23). Self-healing across HA restarts, missed end-triggers,
    modified bookings. NOTE: manual codes with no booking are NOT preserved.'
  triggers:
  - trigger: time_pattern
    minutes: /1
  conditions:
  - condition: time
    after: 05:00:00
    before: '23:00:00'
  actions:
  - action: script.reconcile_bay_door_codes
    data:
      cal: calendar.lane_1_bowling_machine
      sa: input_text.bay1_code_slot_a
      sb: input_text.bay1_code_slot_b
      sc: input_text.bay1_code_slot_c
      c4a: '11'
      c4b: '12'
      c4c: '13'
  - action: script.reconcile_bay_door_codes
    data:
      cal: calendar.lane_2_bowling_machine
      sa: input_text.bay2_code_slot_a
      sb: input_text.bay2_code_slot_b
      sc: input_text.bay2_code_slot_c
      c4a: '14'
      c4b: '15'
      c4c: '16'
  - action: script.reconcile_bay_door_codes
    data:
      cal: calendar.lane_3_truman_or_bowling_machine
      sa: input_text.bay3_code_slot_a
      sb: input_text.bay3_code_slot_b
      sc: input_text.bay3_code_slot_c
      c4a: '17'
      c4b: '18'
      c4c: '19'
  - action: script.reconcile_bay_door_codes
    data:
      cal: calendar.lane_4_run_up_net
      sa: input_text.bay4_code_slot_a
      sb: input_text.bay4_code_slot_b
      sc: input_text.bay4_code_slot_c
      c4a: '20'
      c4b: '21'
      c4c: '22'
  - action: script.reconcile_bay_door_codes
    data:
      cal: calendar.lane_5_run_up_net
      sa: input_text.bay5_code_slot_a
      sb: input_text.bay5_code_slot_b
      sc: input_text.bay5_code_slot_c
      c4a: '23'
      c4b: '24'
      c4c: '25'
  - alias: 'Heartbeat: ping Healthchecks.io Door-Code Reconcile check (silent = reconcile
      dead)'
    action: rest_command.healthchecks_ping_reconcile
    continue_on_error: true
  mode: single
- id: door_code_exempt_nightly_clear
  alias: Door Code Exempt - Nightly Clear
  description: Clears input_text.door_code_exempt every night at 22:30 so manual standing
    door codes never persist past the day. The reconcile sweep (runs until 23:00)
    then removes the now-unexempted code from its slot within a minute.
  triggers:
  - trigger: time
    at: '22:30:00'
  actions:
  - action: input_text.set_value
    target:
      entity_id: input_text.door_code_exempt
    data:
      value: ''
  mode: single
- id: machine_audit_booking_start
  alias: Machine Audit - Booking Start (capture baseline)
  description: 'Captures the lane''s cumulative machine-minutes counter as the audit
    baseline + booking context (customer|bookedMinutes|startISO|email). 2026-08-04
    (Inspector): baseline now captured at POWER-ON (start-9:45, just after the -10min
    power automation) when the lane is idle, so warm-up bowling counts toward usage
    and util% reflects the real powered window (can exceed 100%). At a back-to-back
    boundary the early trigger is skipped (lane calendar still on) and the original
    start+15s trigger captures instead - preserving the 2026-07-06 race fix (ending
    booking reads its baseline before this start overwrites it). The +15s trigger
    skips itself if the early capture already wrote this booking''s context.'
  triggers:
  - trigger: calendar
    entity_id: calendar.lane_1_bowling_machine
    event: start
    offset: 0:00:15
    id: l1
  - trigger: calendar
    entity_id: calendar.lane_2_bowling_machine
    event: start
    offset: 0:00:15
    id: l2
  - trigger: calendar
    entity_id: calendar.lane_3_truman_or_bowling_machine
    event: start
    offset: 0:00:15
    id: l3
  - trigger: calendar
    entity_id: calendar.lane_1_bowling_machine
    event: start
    offset: -0:09:45
    id: l1e
  - trigger: calendar
    entity_id: calendar.lane_2_bowling_machine
    event: start
    offset: -0:09:45
    id: l2e
  - trigger: calendar
    entity_id: calendar.lane_3_truman_or_bowling_machine
    event: start
    offset: -0:09:45
    id: l3e
  conditions:
  - condition: template
    value_template: '{{ not trigger.id.endswith(''e'') or is_state(trigger.entity_id,
      ''off'') }}'
    alias: Early (power-on) capture only when the lane is idle - at a back-to-back
      boundary the previous booking still owns the counter
  - condition: template
    value_template: '{{ trigger.id.endswith(''e'') or states(''input_text.lane_''
      ~ n ~ ''_audit_booking'') != ctx }}'
    alias: Start+15s capture skipped if the early trigger already baselined this booking
  actions:
  - action: input_number.set_value
    target:
      entity_id: input_number.lane_{{ n }}_audit_baseline
    data:
      value: '{{ states(''sensor.lane_'' ~ n ~ ''_machine_minutes'') | float(0) }}'
  - action: input_text.set_value
    target:
      entity_id: input_text.lane_{{ n }}_audit_booking
    data:
      value: '{{ ctx }}'
  mode: queued
  max: 10
  variables:
    n: '{{ trigger.id[1] }}'
    cust: '{{ (trigger.calendar_event.description or '''') | regex_findall(''Customer:
      (.+)'') | first | default(''Unknown'') | trim }}'
    email: '{{ (trigger.calendar_event.description or '''') | regex_findall(''Email:
      (.+)'') | first | default('''') | trim }}'
    booked: '{{ ((as_datetime(trigger.calendar_event.end) - as_datetime(trigger.calendar_event.start)).total_seconds()
      / 60) | round(0) | int }}'
    ctx: '{{ cust }}|{{ booked }}|{{ trigger.calendar_event.start }}|{{ email }}'
- id: machine_audit_booking_end
  alias: Machine Audit - Booking End (compute + record)
  description: 'At each lane booking end: actual machine-use minutes (counter - baseline),
    util%, logs a ''Machine Audit'' logbook record + Machine Audit Last Record helper,
    and POSTs {ts,lane,customer,email,bookedMin,usedMin,utilPct,startISO} to Krickora
    /ha/usage via shell_command.usage_webhook (HMAC-signed, continue_on_error). 2026-08-04
    (Inspector): when there is NO back-to-back next booking, the record now keeps
    measuring past the calendar end - it waits until the next booking claims the lane
    (audit-booking helper changes) or ~10:45 (power cuts at end+10), so tail bowling
    counts and util% can exceed 100% (paired with the power-on baseline in the START
    automation: a solo booking is measured over its full powered window, -10 to +10).
    Back-to-back ends still compute immediately at the boundary (exact-window attribution,
    no double count). Context/baseline are read at trigger time; the clear step is
    guarded so a next booking''s context captured during the wait is never wiped.
    Mode parallel so one lane''s wait cannot delay another lane''s record.'
  triggers:
  - trigger: calendar
    entity_id: calendar.lane_1_bowling_machine
    event: end
    id: l1
  - trigger: calendar
    entity_id: calendar.lane_2_bowling_machine
    event: end
    id: l2
  - trigger: calendar
    entity_id: calendar.lane_3_truman_or_bowling_machine
    event: end
    id: l3
  conditions:
  - condition: template
    value_template: '{{ (ctx | trim) != '''' }}'
  actions:
  - if:
    - condition: template
      value_template: '{{ is_state(trigger.entity_id, ''off'') }}'
    then:
    - wait_for_trigger:
      - trigger: template
        value_template: '{{ states(''input_text.lane_'' ~ n ~ ''_audit_booking'')
          != ctx }}'
      timeout: 0:10:45
      continue_on_timeout: true
    note: No next event active at end -> keep measuring until the next booking overwrites
      the audit context or power cuts at end+10. Back-to-back (calendar still on)
      -> compute immediately, preserving the +15s baseline race fix.
  - variables:
      counter: '{{ states(''sensor.lane_'' ~ n ~ ''_machine_minutes'') | float(0)
        }}'
      used: '{{ (counter - baseline) | round(1) }}'
      util: '{{ ((used / booked * 100) | round(0)) if booked > 0 else 0 }}'
      rec: Lane {{ n }} | {{ cust }} | booked {{ booked | int }}m / used {{ used }}m
        ({{ util }}%)
      payload: '{"ts": {{ now().timestamp() | int }}, "lane": {{ n | int }}, "customer":
        {{ cust | tojson }}, "email": {{ email | tojson }}, "bookedMin": {{ booked
        | int }}, "usedMin": {{ used }}, "utilPct": {{ util }}, "startISO": {{ startiso
        | tojson }}}'
  - action: logbook.log
    data:
      name: Machine Audit
      message: '{{ rec }}'
      entity_id: sensor.lane_{{ n }}_machine_minutes
  - action: input_text.set_value
    target:
      entity_id: input_text.machine_audit_last_record
    data:
      value: '{{ rec[:255] }}'
  - action: shell_command.usage_webhook
    data:
      payload: '{{ payload }}'
    continue_on_error: true
  - if:
    - condition: template
      value_template: '{{ states(''input_text.lane_'' ~ n ~ ''_audit_booking'') ==
        ctx }}'
    then:
    - action: input_text.set_value
      target:
        entity_id: input_text.lane_{{ n }}_audit_booking
      data:
        value: ''
    note: Guarded clear - if a next booking captured its context during the wait,
      leave it untouched.
  mode: parallel
  max: 6
  variables:
    n: '{{ trigger.id[1] }}'
    ctx: '{{ states(''input_text.lane_'' ~ trigger.id[1] ~ ''_audit_booking'') | default('''')
      }}'
    parts: '{{ ctx.split(''|'') }}'
    cust: '{{ parts[0] if (parts | length) > 0 else ''Unknown'' }}'
    booked: '{{ (parts[1] | float(0)) if (parts | length) > 1 else 0 }}'
    startiso: '{{ parts[2] if (parts | length) > 2 else '''' }}'
    email: '{{ parts[3] if (parts | length) > 3 else '''' }}'
    baseline: '{{ states(''input_number.lane_'' ~ trigger.id[1] ~ ''_audit_baseline'')
      | float(0) }}'
- id: roller_door_auto_close_retry
  alias: Roller Door - Auto-Close Retry (3 min -> 2 pulses -> notify Julian)
  description: If binary_sensor.roller_door_contact stays OPEN for 3 min (operator
    30s auto-close failed / door left open), pulse the OPERATE relay (lock.unlock
    on lock.front_door_lock) to close it. Wait up to 20s for the contact to read closed;
    if still open, pulse again; wait another 20s; if STILL open, snapshot camera.pier_facing_entry
    and push Julian with the embedded image. Suppressed while input_boolean.door_service_mode
    (hold-open) is on. Pulse = lock.unlock (proven door OPERATE; lock auto-relocks
    between pulses). Built 2026-07-06.
  triggers:
  - trigger: state
    entity_id: binary_sensor.roller_door_contact
    to: 'on'
    for: 00:03:00
  conditions:
  - condition: state
    entity_id: input_boolean.door_service_mode
    state: 'off'
  - condition: state
    entity_id: input_boolean.team_door_hold
    state: 'off'
  actions:
  - action: lock.unlock
    target:
      entity_id: lock.front_door_lock
  - wait_for_trigger:
    - trigger: state
      entity_id: binary_sensor.roller_door_contact
      to: 'off'
    timeout: 00:00:20
    continue_on_timeout: true
  - if:
    - condition: state
      entity_id: binary_sensor.roller_door_contact
      state: 'off'
    then:
    - stop: Roller door closed after attempt 1
  - action: lock.unlock
    target:
      entity_id: lock.front_door_lock
  - wait_for_trigger:
    - trigger: state
      entity_id: binary_sensor.roller_door_contact
      to: 'off'
    timeout: 00:00:20
    continue_on_timeout: true
  - if:
    - condition: state
      entity_id: binary_sensor.roller_door_contact
      state: 'off'
    then:
    - stop: Roller door closed after attempt 2
  - action: camera.snapshot
    target:
      entity_id: camera.pier_facing_entry
    data:
      filename: /config/www/door_autoclose_snapshot.jpg
  - delay: 00:00:02
  - action: notify.mobile_app_julian
    data:
      title: "\U0001F6A8 Roller Door Won't Close"
      message: The front roller door was open 3 min. HA tried to close it twice and
        it is STILL open - please review the entry.
      data:
        image: /local/door_autoclose_snapshot.jpg
        url: /hassio/ingress/ccab4aaf_frigate/cameras/pier_facing_entry
        clickAction: /hassio/ingress/ccab4aaf_frigate/cameras/pier_facing_entry
  mode: single
  trace:
    stored_traces: 20
- id: notification_log_capture
  alias: Notification Log - Capture pushes to Julian
  description: Intercepts every push sent to Julian (notify.mobile_app_julian and
    notify.notify) and (1) mirrors the latest into a single rolling HA persistent
    notification (the bell) so opening HA shows what the last push was + why, (2)
    writes a timestamped Logbook history against input_text.last_ha_notification,
    (3) stores the latest text in that helper for a dashboard tile. Captures without
    editing the ~13 alert automations. Built 2026-07-06.
  triggers:
  - trigger: event
    event_type: call_service
    event_data:
      domain: notify
      service: mobile_app_julian
    id: julian
  - trigger: event
    event_type: call_service
    event_data:
      domain: notify
      service: notify
    id: broad
  conditions:
  - condition: template
    value_template: '{{ (trigger.event.data.service_data.message | default(''''))
      not in [''clear_notification'', ''remove_notification''] }}'
  actions:
  - action: input_text.set_value
    target:
      entity_id: input_text.last_ha_notification
    data:
      value: '{{ (now().strftime(''%H:%M'') ~ ''  '' ~ title ~ '': '' ~ message)[:255]
        }}'
  - action: logbook.log
    data:
      name: Push to Julian
      message: '{{ title }} - {{ message }} (via notify.{{ svc }})'
      entity_id: input_text.last_ha_notification
  - action: persistent_notification.create
    data:
      notification_id: last_ha_push
      title: 'Last push: {{ title }}'
      message: '{{ message }}


        ---

        Sent {{ stamp }} via notify.{{ svc }}

        (This is the most recent push to your phone. Full history: Logbook -> filter
        ''Last HA Notification''.)'
  mode: queued
  max: 30
  variables:
    title: '{{ trigger.event.data.service_data.title | default(''Notification'', true)
      }}'
    message: '{{ trigger.event.data.service_data.message | default(''(no message)'',
      true) }}'
    svc: '{{ trigger.event.data.service }}'
    stamp: '{{ now().strftime(''%a %d %b %-I:%M %p'') }}'
  trace:
    stored_traces: 20
- id: team_booking_door_open
  alias: Team Booking - Auto-Open Door (tagged bookings)
  description: '15 min before a TEAM booking start (calendar event description contains
    ''AUTO-DOOR''), opens the roller door and stops it just short of full-open (script.team_door_open_short)
    so the operator''s 30s auto-close doesn''t take over. Sets input_boolean.team_door_hold
    + input_datetime.team_door_close_at = booking start + 5 min (Auto-Close automation
    shuts it then). Dedupes multi-lane team bookings via the team_door_hold guard
    + mode single. 2026-08-01 REWORK: door-state gate - only pulses open if the contact
    sensor reads CLOSED; if the door is OPEN at T-15 it waits up to 12 min for it
    to register closed (3s debounce) before pulsing; if still open after the wait,
    the hold/close window is armed WITHOUT pulsing (door is already open for the club).
    If the contact sensor is unavailable/unknown it blind-pulses open + notifies Julian.
    Built 2026-07-07.'
  triggers:
  - trigger: calendar
    entity_id: calendar.lane_1_bowling_machine
    event: start
    offset: -0:15:00
    id: l1
  - trigger: calendar
    entity_id: calendar.lane_2_bowling_machine
    event: start
    offset: -0:15:00
    id: l2
  - trigger: calendar
    entity_id: calendar.lane_3_truman_or_bowling_machine
    event: start
    offset: -0:15:00
    id: l3
  - trigger: calendar
    entity_id: calendar.lane_4_run_up_net
    event: start
    offset: -0:15:00
    id: l4
  - trigger: calendar
    entity_id: calendar.lane_5_run_up_net
    event: start
    offset: -0:15:00
    id: l5
  conditions:
  - condition: template
    value_template: '{{ ''AUTO-DOOR'' in (trigger.calendar_event.description | default(''''))
      }}'
  - condition: state
    entity_id: input_boolean.team_door_hold
    state: 'off'
  actions:
  - alias: If door is open, wait until it registers closed (max 12 min)
    if:
    - condition: state
      entity_id: binary_sensor.roller_door_contact
      state: 'on'
    then:
    - wait_for_trigger:
      - trigger: state
        entity_id: binary_sensor.roller_door_contact
        to: 'off'
        for: 00:00:03
      timeout: 00:12:00
      continue_on_timeout: true
  - action: input_datetime.set_datetime
    target:
      entity_id: input_datetime.team_door_close_at
    data:
      datetime: '{{ (as_local(as_datetime(trigger.calendar_event.start)) + timedelta(minutes=5)).strftime(''%Y-%m-%d
        %H:%M:%S'') }}'
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.team_door_hold
  - action: logbook.log
    data:
      name: Team Door
      message: 'Auto-open for team booking ''{{ trigger.calendar_event.summary }}''
        (start {{ trigger.calendar_event.start }}); close at {{ states(''input_datetime.team_door_close_at'')
        }}. Door contact: {{ states(''binary_sensor.roller_door_contact'') }}.'
      entity_id: input_boolean.team_door_hold
  - alias: Pulse open only from a verified-closed door
    choose:
    - alias: Door closed - normal open pulse
      conditions:
      - condition: state
        entity_id: binary_sensor.roller_door_contact
        state: 'off'
      sequence:
      - action: script.team_door_open_short
    - alias: Door still open after wait - arm window without pulsing
      conditions:
      - condition: state
        entity_id: binary_sensor.roller_door_contact
        state: 'on'
      sequence:
      - action: logbook.log
        data:
          name: Team Door
          message: Door still OPEN after 12-min wait - team window armed WITHOUT pulsing
            (door already open); auto-close will shut it at the scheduled close time.
          entity_id: input_boolean.team_door_hold
      - action: notify.mobile_app_julian
        data:
          title: 'Team door: left open'
          message: Roller door was open at team-booking open time and didn't close
            within 12 min. Window armed without pulsing; auto-close still scheduled.
    default:
    - action: logbook.log
      data:
        name: Team Door
        message: Roller-door contact sensor UNAVAILABLE - blind open pulse (cannot
          verify door closed).
        entity_id: input_boolean.team_door_hold
    - action: notify.mobile_app_julian
      data:
        title: 'Team door: sensor dead'
        message: Roller-door contact sensor is unavailable - blind-pulsed the door
          open for a team booking. Re-pair/check the Zigbee contact sensor.
    - action: script.team_door_open_short
  mode: single
  trace:
    stored_traces: 20
- id: team_booking_door_close
  alias: Team Booking - Auto-Close Door
  description: 'While a team-booking door hold is active (input_boolean.team_door_hold
    on), once now reaches team_door_close_at (booking start + 5 min) pulse the roller
    door to CLOSE, then clear the hold (restores roller-door alerts). Per-minute check
    = restart-safe (survives an HA restart mid-hold). Pulses close if the door is
    actually OPEN (binary_sensor.roller_door_contact on). 2026-08-01 REWORK: if the
    contact sensor is UNAVAILABLE/UNKNOWN, pulses close anyway (blind close) + notifies
    Julian - within a team window the door was opened by us and stopped short (operator
    auto-close never armed), so it is almost certainly still open; the old behaviour
    (skip close on unavailable) guaranteed the door was left open all day. If the
    sensor reads closed, just clears the hold without pulsing. Built 2026-07-07.'
  triggers:
  - trigger: time_pattern
    minutes: /1
  conditions:
  - condition: state
    entity_id: input_boolean.team_door_hold
    state: 'on'
  - condition: template
    value_template: '{{ now().timestamp() >= (state_attr(''input_datetime.team_door_close_at'',''timestamp'')
      | float(0)) }}'
  actions:
  - alias: Close pulse - verified open, or blind when sensor dead
    choose:
    - alias: Door open - pulse close
      conditions:
      - condition: state
        entity_id: binary_sensor.roller_door_contact
        state: 'on'
      sequence:
      - action: lock.unlock
        target:
          entity_id: lock.front_door_lock
      - action: logbook.log
        data:
          name: Team Door
          message: Hold ended - door pulsed closed; alerts restored.
          entity_id: input_boolean.team_door_hold
    - alias: Sensor dead - blind close pulse
      conditions:
      - condition: state
        entity_id: binary_sensor.roller_door_contact
        state:
        - unavailable
        - unknown
      sequence:
      - action: lock.unlock
        target:
          entity_id: lock.front_door_lock
      - action: logbook.log
        data:
          name: Team Door
          message: Hold ended - contact sensor UNAVAILABLE, BLIND close pulse sent
            (door presumed open from team window); alerts restored.
          entity_id: input_boolean.team_door_hold
      - action: notify.mobile_app_julian
        data:
          title: 'Team door: blind close'
          message: Team window ended but the roller-door contact sensor is unavailable
            - sent a blind close pulse. Verify the door is closed; re-pair the sensor.
    default:
    - action: logbook.log
      data:
        name: Team Door
        message: Hold ended - door was already closed; alerts restored.
        entity_id: input_boolean.team_door_hold
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.team_door_hold
  mode: single
  trace:
    stored_traces: 20
- id: lane_display_tv_power
  alias: Lane Display TV - Power (booking window)
  description: Powers the lane-display TV's Zigbee plug (switch.lane_display_tv) ON
    from ~25 min before the day's first lane booking to ~15 min after the day's last,
    OFF otherwise. Slightly wider than the Pi's CEC on-window so the TV always has
    clean power when the board should show. With the TV set to 'Power On Mode = On',
    re-powering turns it on without CEC - the durable fix for the Falcon deep-standby
    issue. Per-5-min + on-HA-start = restart-safe. Built 2026-07-08.
  triggers:
  - trigger: time_pattern
    minutes: /5
  - trigger: homeassistant
    event: start
  actions:
  - action: calendar.get_events
    target:
      entity_id:
      - calendar.lane_1_bowling_machine
      - calendar.lane_2_bowling_machine
      - calendar.lane_3_truman_or_bowling_machine
      - calendar.lane_4_run_up_net
      - calendar.lane_5_run_up_net
    data:
      start_date_time: '{{ today_at(''00:00'') }}'
      end_date_time: '{{ today_at(''23:59:59'') }}'
    response_variable: tv_events
  - variables:
      want_on: '{% set ns = namespace(starts=[], ends=[]) %}{% for cal, d in tv_events.items()
        %}{% for e in (d.events | default([])) %}{% set s = e.start.dateTime if (e.start
        is mapping) else e.start %}{% set en = e.end.dateTime if (e.end is mapping)
        else e.end %}{% set ns.starts = ns.starts + [as_datetime(s)] %}{% set ns.ends
        = ns.ends + [as_datetime(en)] %}{% endfor %}{% endfor %}{% if ns.starts |
        count == 0 %}false{% else %}{{ (now() >= (ns.starts | min) - timedelta(minutes=25))
        and (now() <= (ns.ends | max) + timedelta(minutes=15)) }}{% endif %}'
  - if:
    - condition: template
      value_template: '{{ want_on | bool(false) }}'
    then:
    - action: switch.turn_on
      target:
        entity_id: switch.lane_display_tv
    else:
    - action: switch.turn_off
      target:
        entity_id: switch.lane_display_tv
  mode: single
  trace:
    stored_traces: 20
- id: highbay_clear_stranded_neighbours
  alias: Highbays - Clear Stranded Neighbour Lights
  description: 'Fixes the dawn-transition strand: neighbour highbays are lit while
    dark (incl. pre-sunrise bookings) but the bay-end automations only clear them
    in the evening (''after sunset''), so a pre-dawn booking''s neighbour lights never
    got cleared after sunrise. On any booking end (bay helper -> off), turns OFF each
    highbay only if EVERY lane feeding it (its own lane + the lanes it neighbours)
    has no active booking. Guarded so it never turns off a light an active booking
    needs; skipped in busy mode; does NOT touch manually-lit lights (only runs at
    booking end). Highbay 3 (night residual) is only cleared while the sun is up.
    Built 2026-07-09.'
  triggers:
  - trigger: state
    entity_id:
    - input_boolean.bay1_helper
    - input_boolean.bay2_helper
    - input_boolean.bay3_helper
    - input_boolean.bay4_helper
    - input_boolean.bay5_helper
    to: 'off'
  conditions:
  - condition: state
    entity_id: input_boolean.lighting_all_lanes_active
    state: 'off'
  actions:
  - delay: 00:00:02
  - if:
    - condition: state
      entity_id:
      - input_boolean.bay1_helper
      - input_boolean.bay2_helper
      state: 'off'
    then:
    - action: light.turn_off
      target:
        entity_id: light.highbay_1
  - if:
    - condition: state
      entity_id:
      - input_boolean.bay1_helper
      - input_boolean.bay2_helper
      - input_boolean.bay3_helper
      state: 'off'
    then:
    - action: light.turn_off
      target:
        entity_id: light.highbay_2
  - if:
    - condition: state
      entity_id:
      - input_boolean.bay2_helper
      - input_boolean.bay3_helper
      - input_boolean.bay4_helper
      state: 'off'
    - condition: state
      entity_id: sun.sun
      state: above_horizon
    then:
    - action: light.turn_off
      target:
        entity_id: light.highbay_3
  - if:
    - condition: state
      entity_id:
      - input_boolean.bay3_helper
      - input_boolean.bay4_helper
      - input_boolean.bay5_helper
      state: 'off'
    then:
    - action: light.turn_off
      target:
        entity_id: light.highbay_4
  - if:
    - condition: state
      entity_id:
      - input_boolean.bay4_helper
      - input_boolean.bay5_helper
      state: 'off'
    then:
    - action: light.turn_off
      target:
        entity_id: light.highbay_5
  mode: single
  trace:
    stored_traces: 20
- id: highbay_reconcile_after_control4_recovery
  alias: Highbays - Reconcile after Control4 recovery
  description: 'Fixes highbay light drift from the recurring multi-minute Control4
    dropouts. When C4 recovers (its highbay entities return from ''unavailable'' after
    the feed reloads) or when the Reconcile Bay Lights button is pressed, it re-derives
    all highbay lights from the current bookings via script.reconcile_highbay_lights.
    GATED on input_boolean.control4_ready: during a power-outage boot recovery that
    flag is OFF (held by the Power Outage Recovery — Fail-Bright automation, which
    owns the boot reconcile after its fail-bright hold), so this does not undo the
    fail-bright blast-on. The HA-start trigger was removed 2026-07-28 for the same
    reason. Built 2026-07-09, gated 2026-07-28.'
  triggers:
  - trigger: state
    entity_id:
    - light.highbay_1
    - light.highbay_2
    - light.highbay_3
    - light.highbay_4
    - light.highbay_5
    from: unavailable
    id: recovery
  - trigger: state
    entity_id: input_button.reconcile_bay_lights
    id: manual
  conditions:
  - condition: state
    entity_id: input_boolean.control4_ready
    state: 'on'
  actions:
  - if:
    - condition: template
      value_template: '{{ trigger.id != ''manual'' }}'
    then:
    - delay: 00:00:10
  - action: script.reconcile_highbay_lights
  - action: logbook.log
    data:
      name: Bay Reconcile
      message: 'Reconciled highbay lights to current bookings (trigger: {{ trigger.id
        }}).'
      entity_id: light.highbay_1
  mode: single
  trace:
    stored_traces: 20
- id: control4_ready_failsafe_autoclear
  alias: Control4 Ready - Failsafe Auto-Clear (stuck off)
  description: Safety net for the control4_ready gate. control4_ready is normally
    ON; the Power Outage Recovery — Fail-Bright automation holds it OFF only briefly
    (~3-5 min) during a boot recovery, then sets it back ON. If it is ever stuck OFF
    for 20+ min (e.g. the recovery automation was killed mid-run), this forces it
    back ON so the gated reconcile/night-shutdown/all-off automations aren't left
    permanently disabled. Built 2026-07-28.
  triggers:
  - trigger: state
    entity_id: input_boolean.control4_ready
    to: 'off'
    for: 00:20:00
  actions:
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.control4_ready
  - action: logbook.log
    data:
      name: Control4 Ready
      message: 'Failsafe: control4_ready was stuck OFF for 20 min — forced back ON
        so gated lighting automations resume.'
      entity_id: input_boolean.control4_ready
  - action: notify.mobile_app_julian
    data:
      title: Control4 Ready flag auto-cleared
      message: control4_ready was stuck off 20 min and was forced back on. If lighting
        behaved oddly after a recovery, check the Power Outage Recovery automation
        trace.
  mode: single
- id: '1785466770276'
  alias: Network Watchdog - Ping every 30s
  description: 'Forces a fresh ping of all network-watchdog probes every 30 seconds
    so device-down detection is near real-time (the Ping integration''s native poll
    is slower). Pairs with ''Network Watchdog - Device Down/Recovered Alert''. NOTE
    2026-08-01: binary_sensor.192_168_1_127 (keypad ping) removed — the keypad''s
    DHCP lease moved to .121 after the 31-Jul power loss, so .127 was pinging a vacant
    IP (false down alerts). Keypad coverage is now via binary_sensor.cricket_keypad_online
    (ESPHome push-based, no forced poll needed). Re-add a ping probe here only after
    a DHCP reservation pins the keypad''s IP.'
  triggers:
  - trigger: time_pattern
    seconds: /30
  actions:
  - action: homeassistant.update_entity
    target:
      entity_id:
      - binary_sensor.192_168_1_2
      - binary_sensor.192_168_1_112
      - binary_sensor.1_1_1_1
      - binary_sensor.lane_display_pi_ping
  mode: single
- id: '1785466777919'
  alias: Network Watchdog - Device Down/Recovered Alert
  description: 'Pushes to Julian''s phone when any monitored network device (Reyee
    switch, Control4 Director, roller-door keypad, internet uplink) is unreachable
    for 30s, and again when it recovers. Down = critical sound so it breaks through
    silent/DND. NOTE 2026-08-01: keypad probe = binary_sensor.cricket_keypad_online
    (ESPHome connectivity, IP-agnostic) — the old ping probe binary_sensor.192_168_1_127
    went stale when the keypad''s DHCP lease moved to .121 after the 31-Jul power
    loss; re-add a ping probe only after a DHCP reservation pins the keypad''s IP.'
  triggers:
  - trigger: state
    id: down
    entity_id:
    - binary_sensor.192_168_1_2
    - binary_sensor.192_168_1_112
    - binary_sensor.cricket_keypad_online
    - binary_sensor.1_1_1_1
    to: 'off'
    for:
      seconds: 30
  - trigger: state
    id: up
    entity_id:
    - binary_sensor.192_168_1_2
    - binary_sensor.192_168_1_112
    - binary_sensor.cricket_keypad_online
    - binary_sensor.1_1_1_1
    from: 'off'
    to: 'on'
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: down
      sequence:
      - action: notify.mobile_app_julian
        data:
          title: ⚠️ Cricket network DOWN
          message: '{{ trigger.to_state.attributes.friendly_name }} has gone offline
            (unreachable 30s+). Door access / remote access may be affected.'
          data:
            push:
              sound:
                name: default
                critical: 1
                volume: 1
            tag: network-watchdog-{{ trigger.entity_id }}
    - conditions:
      - condition: trigger
        id: up
      sequence:
      - action: notify.mobile_app_julian
        data:
          title: ✅ Cricket network recovered
          message: '{{ trigger.to_state.attributes.friendly_name }} is back online.'
          data:
            tag: network-watchdog-{{ trigger.entity_id }}
  mode: parallel
  max: 12
- id: '1785471383130'
  alias: Lanes - Lighting + Machine Reconcile (every minute, self-heal)
  description: 'Self-healing safety net. Every minute, for each of the 5 lanes, reads
    the lane calendar; if a booking is active or starts within ~11 min it ENSURES
    that lane''s highbay light is ON (plus adjacent neighbours - full adjacency since
    2026-08-04, Inspector: Lane 1 -> hb2, Lane 2 -> hb1+hb3, Lane 3 -> hb2+hb4, Lane
    4 -> hb3+hb5, Lane 5 -> hb4) unless the bay is blocked, and for machine lanes
    1/2/3 ensures the correctly Truman-gated bowling-machine plug(s) are ON. ON-ENSURE
    ONLY: it never turns anything OFF, so it cannot cut a session mid-way or fight
    the per-bay END / night shutdown / outage-off logic. Fills two gaps: (a) a booking
    created/changed inside the T-11/T-10 offset window that never fires the per-bay
    START trigger, and (b) after a Control4 feed freeze / Zigbee blip / HA restart,
    it re-asserts the correct ON state within a minute once the link is back. Gated
    on input_boolean.control4_ready (stays out of the way during the fail-bright power-outage
    recovery) and operating hours 05:00-22:15 (below the 22:15 absolute all-off catch-all).
    continue_on_error so an off-mesh plug (e.g. lane_1_right) can''t halt the sweep.
    Built 2026-07-31.'
  triggers:
  - trigger: time_pattern
    minutes: /1
  conditions:
  - condition: state
    entity_id: input_boolean.control4_ready
    state: 'on'
  - condition: time
    after: 05:00:00
    before: '22:15:00'
  actions:
  - repeat:
      for_each: '{{ lanes }}'
      sequence:
      - action: calendar.get_events
        target:
          entity_id: '{{ repeat.item.cal }}'
        data:
          start_date_time: '{{ (now() - timedelta(minutes=1)).isoformat() }}'
          end_date_time: '{{ (now() + timedelta(minutes=11)).isoformat() }}'
        response_variable: ev
      - if:
        - condition: template
          value_template: '{{ (ev[repeat.item.cal].events | default([])) | count >
            0 }}'
        then:
        - if:
          - condition: template
            value_template: '{{ is_state(repeat.item.blocked, ''off'') }}'
          then:
          - action: light.turn_on
            continue_on_error: true
            target:
              entity_id: '{{ ([repeat.item.light] + repeat.item.neighbours) | join('','')
                }}'
          - action: input_boolean.turn_on
            continue_on_error: true
            target:
              entity_id: '{{ repeat.item.helper }}'
        - if:
          - condition: template
            value_template: '{{ repeat.item.plugL | length > 0 }}'
          then:
          - action: switch.turn_on
            continue_on_error: true
            target:
              entity_id: '{% set d = (ev[repeat.item.cal].events | first).description
                | default('''') %}{% set tl = states(''input_select.truman_location'')
                %}{% set here = tl in [repeat.item.posL, repeat.item.posR] %}{% set
                is_coach = ''Coach Session'' in d %}{% set is_customer = ''Net Session''
                in d %}{% set paid = ''(Truman)'' in d %}{% if (not here) or is_coach
                or (is_customer and paid) %}{{ repeat.item.plugL }},{{ repeat.item.plugR
                }}{% else %}{{ repeat.item.plugR if tl == repeat.item.posL else repeat.item.plugL
                }}{% endif %}'
  mode: single
  variables:
    lanes:
    - cal: calendar.lane_1_bowling_machine
      light: light.highbay_1
      helper: input_boolean.bay1_helper
      blocked: input_boolean.bay1_blocked
      neighbours:
      - light.highbay_2
      plugL: switch.lane_1_left
      plugR: switch.lane_1_right
      posL: Lane 1 Left
      posR: Lane 1 Right
    - cal: calendar.lane_2_bowling_machine
      light: light.highbay_2
      helper: input_boolean.bay2_helper
      blocked: input_boolean.bay2_blocked
      neighbours:
      - light.highbay_1
      - light.highbay_3
      plugL: switch.lane_2_left
      plugR: switch.lane_2_right
      posL: Lane 2 Left
      posR: Lane 2 Right
    - cal: calendar.lane_3_truman_or_bowling_machine
      light: light.highbay_3
      helper: input_boolean.bay3_helper
      blocked: input_boolean.bay3_blocked
      neighbours:
      - light.highbay_2
      - light.highbay_4
      plugL: switch.lane_3_left
      plugR: switch.lane_3_right
      posL: Lane 3 Left
      posR: Lane 3 Right
    - cal: calendar.lane_4_run_up_net
      light: light.highbay_4
      helper: input_boolean.bay4_helper
      blocked: input_boolean.bay4_blocked
      neighbours:
      - light.highbay_3
      - light.highbay_5
      plugL: ''
      plugR: ''
      posL: ''
      posR: ''
    - cal: calendar.lane_5_run_up_net
      light: light.highbay_5
      helper: input_boolean.bay5_helper
      blocked: input_boolean.bay5_blocked
      neighbours:
      - light.highbay_4
      plugL: ''
      plugR: ''
      posL: ''
      posR: ''
- id: '1785734844911'
  alias: Healthcheck - External Heartbeat (Healthchecks.io)
  description: 'Pings an EXTERNAL watchdog (Healthchecks.io) every 5 minutes. If Home
    Assistant, the HA box, its power, or the site internet dies, the pings stop and
    Healthchecks.io raises the alarm by email/phone. WHY: every other watchdog we
    run lives INSIDE HA, so none of them can alert when HA itself is what failed -
    proven on 2026-08-03 when the box hung overnight and nothing told anyone (the
    first sign would have been a coach locked out at the door). SETUP: paste the check''s
    ping URL into input_text.healthchecks_ping_url - this automation stays inert while
    that helper is empty. Recommended check settings at healthchecks.io: Period 5
    minutes, Grace 15 minutes (a normal HA restart takes 2-5 min and must NOT alert;
    a real outage alerts within ~20 min). The URL lives in .storage, not git, so the
    check''s secret UUID is never committed.'
  triggers:
  - trigger: time_pattern
    minutes: /5
  conditions:
  - condition: not
    conditions:
    - condition: state
      entity_id: input_text.healthchecks_ping_url
      state:
      - ''
      - unknown
      - unavailable
  actions:
  - action: rest_command.healthchecks_ping
    continue_on_error: true
  mode: single
- id: '1785811915396'
  alias: TV - On at First Door Open (bookings TV)
  description: Any roller-door open (physical contact sensor OR the front-door lock
    pulsing unlocked) -> ping rest_command.tv_door_open, which stamps a date marker
    on the lane-display Pi (cricket-door-listener :8800). cricket-tv-cec.py reads
    the marker and holds the bookings TV ON over HDMI-CEC from the FIRST door open
    of the day until 21:30, independent of the booking schedule (a booking window
    can still hold it later; the TV's smart plug has been removed so CEC is the only
    power path). Fires on EVERY open - the stamp is idempotent, so no first-of-day
    state is needed in HA. Time-gated 05:00-21:30 (the listener enforces the same
    gate) so a late-night or small-hours open can never hold the TV on overnight.
    Built 2026-08-04 (Inspector).
  triggers:
  - trigger: state
    entity_id: binary_sensor.roller_door_contact
    to: 'on'
  - trigger: state
    entity_id: lock.front_door_lock
    to: unlocked
  conditions:
  - condition: time
    after: 05:00:00
    before: '21:30:00'
  actions:
  - action: rest_command.tv_door_open
  mode: single
  max_exceeded: silent
- id: '1785928193955'
  alias: Door - Unlock Command-Verify (reload C4 + retry on frozen feed)
  description: 'SAFETY NET built 2026-08-05 during the evening Control4 freeze incident,
    REVISED same night: verification now uses binary_sensor.roller_door_contact (PHYSICAL
    ground truth) instead of lock.front_door_lock state, because the C4 reload re-registers
    the lock entity (unavailable->locked) and that transition fooled the original
    lock-state check into false ''worked on retry'' reports while the door never moved.
    Success = door contact reads OPEN, or just transitioned within 20s, or (contact
    unavailable) lock state changed within 15s as a weak fallback. Flow: every lock.unlock
    command is verified 8s later; if the door demonstrably did not move -> reload
    the Control4 config entry (01KM09V3X1JDWRBA7KSWMD1WAJ), wait for the lock entity
    to come back, re-fire the unlock ONCE, verify again, and push Julian (CRITICAL
    if the door still has not moved - during the 2026-08-05 incident the command path
    stayed dead across reloads, suspected Director->DIN-relay link on the flapping
    Reyee switch, so the CRITICAL path is the one that matters). mode:single drops
    the retry''s own call_service event (loop-proof). Template age-checks are intentional:
    ''no transition at all'' has no native condition. Remove/disable once the C4 network
    link is fixed.'
  triggers:
  - trigger: event
    event_type: call_service
    event_data:
      domain: lock
      service: unlock
  conditions: []
  actions:
  - delay: 00:00:08
  - if:
    - condition: template
      value_template: '{{ not ( is_state(''binary_sensor.roller_door_contact'',''on'')
        or (is_state(''binary_sensor.roller_door_contact'',''off'') and (as_timestamp(now())
        - as_timestamp(states.binary_sensor.roller_door_contact.last_changed)) < 20)
        or (states(''binary_sensor.roller_door_contact'') in [''unavailable'',''unknown'']
        and states(''lock.front_door_lock'') != ''unavailable'' and (as_timestamp(now())
        - as_timestamp(states.lock.front_door_lock.last_changed)) < 15) ) }}'
    then:
    - action: homeassistant.reload_config_entry
      data:
        entry_id: 01KM09V3X1JDWRBA7KSWMD1WAJ
      note: 'Door did not physically move after an unlock command: C4 command path
        suspect. Reload resyncs the integration.'
    - wait_template: '{{ states(''lock.front_door_lock'') not in [''unavailable'',''unknown'']
        }}'
      timeout: 00:00:30
      continue_on_timeout: true
    - delay: 00:00:02
    - action: lock.unlock
      target:
        entity_id: lock.front_door_lock
      continue_on_error: true
      note: One retry immediately after reload, while the fresh connection is most
        likely to work.
    - delay: 00:00:10
    - if:
      - condition: template
        value_template: '{{ not ( is_state(''binary_sensor.roller_door_contact'',''on'')
          or (is_state(''binary_sensor.roller_door_contact'',''off'') and (as_timestamp(now())
          - as_timestamp(states.binary_sensor.roller_door_contact.last_changed)) <
          30) ) }}'
      then:
      - action: notify.mobile_app_julian
        data:
          title: "\U0001F6A8 Front door did NOT open (unlock dead)"
          message: An unlock command produced no physical door movement even after
            reloading Control4 and retrying. Someone may be locked out at the roller
            door - check the entry camera. Suspect the Director->relay network link
            (Reyee switch / DIN relay modules).
          data:
            push:
              sound:
                name: default
                critical: 1
                volume: 1
      else:
      - action: notify.mobile_app_julian
        data:
          title: ⚠️ Door unlock needed a C4 reload
          message: An unlock command was swallowed by a frozen Control4 feed. Auto-reloaded
            and retried - the door contact confirms it physically opened. The C4 link
            is unstable; Reyee switch suspect.
  mode: single
- id: watchdog_booking_triggers
  alias: Watchdog - Booking Automations Not Firing
  description: 'Detects the 2026-08-06 failure mode: HA''s CALENDAR TRIGGERS silently
    stop rescheduling (after a calendar update times out) and every calendar-driven
    automation goes quiet forever with NO error - bay_N_booking_start/_end, lane machine
    power, machine audit, team auto-door. It went unnoticed for 4 DAYS because the
    every-minute reconcile only ever ENSURES-ON, so lights still came on for bookings
    and the facility looked normal; nothing turned anything off and the night shutdown
    could never fire (helpers stuck on). Neither Control4 watchdog covers this - they
    check the STATE FEED, which was healthy throughout. Every 30 min this compares
    ground truth (a booking demonstrably started) against effect (did that lane''s
    start automation fire?). Templates are unavoidable here: the check correlates
    a service RESPONSE against automation last_triggered, which no native condition
    expresses. Throttled by input_boolean.booking_trigger_watchdog_alerted so it alerts
    once per episode plus a recovery message. FIX when it fires: reload automations,
    and if that does not re-arm them, RESTART Home Assistant (on 2026-08-10 a reload
    was not sufficient; the restart was). Built 2026-08-10 -> BUILD_HA_2026-08-10.md'
  triggers:
  - trigger: time_pattern
    minutes: /30
  conditions:
  - condition: time
    after: 07:00:00
    before: '22:30:00'
    note: Both bounds required - a one-sided time condition anchors at midnight. Outside
      booking hours there is nothing to verify.
  actions:
  - action: calendar.get_events
    target:
      entity_id:
      - calendar.lane_1_bowling_machine
      - calendar.lane_2_bowling_machine
      - calendar.lane_3_truman_or_bowling_machine
      - calendar.lane_4_run_up_net
      - calendar.lane_5_run_up_net
    data:
      start_date_time: '{{ (now() - timedelta(hours=2)).isoformat() }}'
      end_date_time: '{{ now().isoformat() }}'
    response_variable: recent
    continue_on_error: true
  - variables:
      stale_lanes: '{% set lanes = {''calendar.lane_1_bowling_machine'': ''automation.bay_1_booking_start'',''calendar.lane_2_bowling_machine'':
        ''automation.bay_2_booking_start'',''calendar.lane_3_truman_or_bowling_machine'':
        ''automation.bay_3_booking_start'',''calendar.lane_4_run_up_net'': ''automation.bay_4_booking_start'',''calendar.lane_5_run_up_net'':
        ''automation.bay_5_booking_start''} %}{% set t = as_timestamp(now()) %}{%
        set win_from = t - 7200 %}{% set win_to = t - 1500 %}{% set ns = namespace(bad=[])
        %}{% for cal, auto in lanes.items() %}{% set evs = ((recent | default({})).get(cal,
        {}) or {}).get(''events'', []) %}{% set ns2 = namespace(started=0) %}{% for
        e in evs %}{% set st = as_timestamp(e.start, 0) %}{% if st >= win_from and
        st <= win_to %}{% set ns2.started = ns2.started + 1 %}{% endif %}{% endfor
        %}{% if ns2.started > 0 %}{% set lt = state_attr(auto, ''last_triggered'')
        %}{% if lt is none or (t - as_timestamp(lt)) > 9000 %}{% set ns.bad = ns.bad
        + [cal.split(''.'')[1]] %}{% endif %}{% endif %}{% endfor %}{{ ns.bad | join('',
        '') }}'
    note: A booking that STARTED between now-2h and now-25min must have fired that
      lane's booking_start automation at start-11min. Only events whose START falls
      in the window count - get_events also returns long overlapping events whose
      trigger fired much earlier.
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ stale_lanes != '''' }}'
      - condition: state
        entity_id: input_boolean.booking_trigger_watchdog_alerted
        state: 'off'
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.booking_trigger_watchdog_alerted
      - action: logbook.log
        data:
          name: Booking Trigger Watchdog
          message: 'FAULT - bookings started but booking_start did not fire on: {{
            stale_lanes }}'
      - action: notify.mobile_app_julian
        data:
          title: "\U0001F6A8 Booking automations NOT firing"
          message: 'A booking started on {{ stale_lanes }} but that lane''s booking_start
            automation never fired. HA''s calendar triggers have likely stopped rescheduling
            - lights/machines will not switch OFF, the night shutdown cannot run,
            and team auto-door is dead. FIX: reload automations; if that does not
            work, restart Home Assistant.'
          data:
            push:
              sound:
                name: default
                critical: 1
                volume: 1
            tag: booking_trigger_watchdog
    - conditions:
      - condition: template
        value_template: '{{ stale_lanes == '''' }}'
      - condition: state
        entity_id: input_boolean.booking_trigger_watchdog_alerted
        state: 'on'
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.booking_trigger_watchdog_alerted
      - action: notify.mobile_app_julian
        data:
          message: clear_notification
          data:
            tag: booking_trigger_watchdog
      - action: notify.mobile_app_julian
        data:
          title: ✅ Booking automations firing again
          message: Calendar-triggered booking automations have resumed firing normally.
  mode: single
- id: watchdog_bay_helper_stuck
  alias: Watchdog - Bay Helper Stuck On
  description: 'Second, independent net for the 2026-08-06 failure. A bay helper is
    set at booking start (T-11) and cleared by bay_N_booking_end (T+10), so it should
    never be on for more than a long booking plus lead/lag. When bay_N_booking_end
    stops firing the helper sticks ON forever, and that single fact breaks two things
    silently: night_staggered_shutdown can never run (it triggers on a helper going
    OFF and requires all 5 off - it went 4 nights without firing, lights burning until
    the 22:15 catch-all), and the common-lights daylight gate is permanently satisfied
    (it ORs on any-helper-on) so occupancy lights the building in daylight regardless
    of bookings. Deliberately native (state + for:) with no templates, so it stays
    working even if the fancier calendar-vs-fire watchdog has a problem - the two
    are independent by design. Threshold 7h: the longest real booking seen is 4h (~4h20m
    of helper time), so 7h cannot false-positive on a legitimate session. CAVEAT:
    a `for:` clock restarts on every HA restart, so after a restart a genuinely stuck
    helper takes another 7h to alert - acceptable for a slow-burn fault. Alert only,
    never auto-clears the helper: clearing it could let the night shutdown run during
    a long booking that is still in progress (the shutdown only checks for bookings
    STARTING within 30 min, not ones already running). Built 2026-08-10 -> BUILD_HA_2026-08-10.md'
  triggers:
  - trigger: state
    entity_id:
    - input_boolean.bay1_helper
    - input_boolean.bay2_helper
    - input_boolean.bay3_helper
    - input_boolean.bay4_helper
    - input_boolean.bay5_helper
    to: 'on'
    for:
      hours: 7
    note: 'Native for: - no template duration math. Fires per entity.'
  conditions: []
  actions:
  - action: logbook.log
    data:
      name: Bay Helper Watchdog
      message: FAULT - {{ trigger.to_state.name }} has been ON for 7h; bay booking_end
        has probably stopped firing.
  - action: notify.mobile_app_julian
    data:
      title: ⚠️ Bay helper stuck on ({{ trigger.to_state.name }})
      message: '{{ trigger.to_state.name }} has been ON for 7 hours, so that bay''s
        booking_end automation has probably stopped firing. Consequences: the night
        lights shutdown CANNOT run (lights will burn until the 22:15 catch-all) and
        common lights lose their daylight gate. FIX: reload automations; if that does
        not work, restart Home Assistant. Then switch the stuck helper off manually.'
      data:
        tag: bay_helper_stuck_{{ trigger.entity_id }}
  mode: parallel
  max: 5
- id: '1786431157629'
  alias: Watchdog - Calendar Fetch Probe (every 10 min)
  description: 'Proves the HA->Google Calendar API path is alive. Every 10 minutes
    performs a REAL calendar.get_events fetch across all 5 lane calendars; on success
    stamps input_datetime.last_calendar_fetch_ok. If Google auth/quota/API breaks,
    the fetch throws, the stamp stays stale, and the companion ''Calendar Fetch STALE''
    watchdog raises a critical push. Built 2026-08-11 to close the biggest monitoring
    gap: the door-code reconcile keeps running (and pinging Healthchecks) even when
    its calendar SOURCE has silently died - nothing else watches the upstream half
    of the door-code supply chain.'
  triggers:
  - trigger: time_pattern
    minutes: /10
  conditions:
  - condition: time
    after: 04:30:00
    before: '23:00:00'
  actions:
  - action: calendar.get_events
    target:
      entity_id:
      - calendar.lane_1_bowling_machine
      - calendar.lane_2_bowling_machine
      - calendar.lane_3_truman_or_bowling_machine
      - calendar.lane_4_run_up_net
      - calendar.lane_5_run_up_net
    data:
      duration:
        hours: 1
    response_variable: cal_probe
  - action: input_datetime.set_datetime
    target:
      entity_id: input_datetime.last_calendar_fetch_ok
    data:
      datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
  mode: single
- id: '1786431187495'
  alias: Watchdog - Calendar Fetch STALE (critical)
  description: 'Companion to the Calendar Fetch Probe. If the last successful calendar
    fetch (input_datetime.last_calendar_fetch_ok) is older than 45 minutes during
    operating hours, the HA->Google path is dead: door codes will silently stop loading
    even though HA and the reconcile look healthy. Sends a CRITICAL push every 30
    min while stale. Template condition is unavoidable (timestamp-age math, same pattern
    as the existing watchdogs).'
  triggers:
  - trigger: time_pattern
    minutes: /30
  conditions:
  - condition: time
    after: 05:30:00
    before: '23:00:00'
  - condition: template
    value_template: '{{ (now().timestamp() - state_attr(''input_datetime.last_calendar_fetch_ok'',
      ''timestamp'')) > 2700 }}'
  actions:
  - action: notify.mobile_app_julian
    data:
      title: "\U0001F6A8 Calendar fetch DEAD"
      message: HA has not successfully fetched the lane calendars since {{ states('input_datetime.last_calendar_fetch_ok')
        }} ({{ ((now().timestamp() - state_attr('input_datetime.last_calendar_fetch_ok',
        'timestamp')) / 60) | round(0) }} min ago). Door codes will STOP loading for
        new bookings. Check Google Calendar integration / internet on the HA box.
      data:
        push:
          sound:
            name: default
            critical: 1
            volume: 1
  mode: single
- id: '1786431204597'
  alias: Watchdog - HA Box Disk Low (below 80 GB free)
  description: Disk-full is a suspected contributor to the HA box hang class (89%
    full on 2026-08-03; two overnight outages Aug 2026). Alerts when root-disk free
    space (sensor.system_monitor_disk_free, GB) stays below 80 GB (~83% full) for
    15 minutes. Frigate recordings are the usual culprit - see FRIGATE_RETENTION_CHANGE_2026-08-03.md
    for the prepared fix.
  triggers:
  - trigger: numeric_state
    entity_id: sensor.system_monitor_disk_free
    below: 80
    for:
      minutes: 15
  actions:
  - action: notify.mobile_app_julian
    data:
      title: ⚠️ HA box disk low
      message: Free disk is {{ states('sensor.system_monitor_disk_free') }} GB (used
        {{ states('sensor.system_monitor_disk_use') }} GB). Below 80 GB free. Disk
        pressure was a suspected factor in the box hangs - prune Frigate or apply
        the retention change.
  mode: single
- id: '1786431252107'
  alias: Watchdog - Critical Sensor Dropout (30 min unavailable)
  description: 'Alerts when a safety- or booking-critical device drops off the network
    for 30+ minutes. These failures were previously SILENT and each one quietly blinds
    an automation: roller-door contact (auto-door verify + left-open escalation go
    inert), Fire Exit WEST contact (opened-alert goes blind), Zigbee machine plugs
    (machine power fails + they are ROUTERS - their absence destabilises the battery
    sensors'' mesh), lane-display TV plug. Fires once per device per dropout (trigger
    on the transition); devices ALREADY unavailable when this was built are caught
    by the companion 08:00 morning digest.'
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.roller_door_contact
    - binary_sensor.0x54ef4410014ae8c0_contact
    - switch.lane_1_left
    - switch.lane_1_right
    - switch.lane_2_left
    - switch.lane_2_right
    - switch.lane_3_left
    - switch.lane_3_right
    - switch.lane_display_tv
    to: unavailable
    for:
      minutes: 30
  actions:
  - action: notify.mobile_app_julian
    data:
      title: ⚠️ Device offline 30+ min
      message: '{{ trigger.to_state.name }} ({{ trigger.entity_id }}) has been unavailable
        since {{ trigger.from_state.last_changed.astimezone().strftime(''%H:%M'')
        }}. Automations depending on it are blind - likely Zigbee off-mesh drop (re-pair)
        or power.'
  mode: parallel
  max: 10
- id: '1786431271899'
  alias: Watchdog - Morning Device Health Digest (08:00)
  description: Daily 08:00 summary of any critical device currently unavailable, so
    standing dropouts (which the transition-triggered dropout watchdog cannot see)
    never linger silently for weeks again - e.g. the roller-door contact was dead
    24 Jul - 3 Aug and the Fire Exit WEST contact + 3 router plugs have been off-mesh
    since before 10 Aug. Repeats daily until the device is fixed/re-paired - that
    nagging is deliberate. Template is required (dynamic list assembly across a watchlist).
  triggers:
  - trigger: time
    at: 08:00:00
  conditions:
  - condition: or
    conditions:
    - condition: state
      entity_id: binary_sensor.roller_door_contact
      state: unavailable
    - condition: state
      entity_id: binary_sensor.0x54ef4410014ae8c0_contact
      state: unavailable
    - condition: state
      entity_id: switch.lane_1_left
      state: unavailable
    - condition: state
      entity_id: switch.lane_1_right
      state: unavailable
    - condition: state
      entity_id: switch.lane_2_left
      state: unavailable
    - condition: state
      entity_id: switch.lane_2_right
      state: unavailable
    - condition: state
      entity_id: switch.lane_3_left
      state: unavailable
    - condition: state
      entity_id: switch.lane_3_right
      state: unavailable
    - condition: state
      entity_id: switch.lane_display_tv
      state: unavailable
    - condition: state
      entity_id: binary_sensor.cricket_keypad_online
      state:
      - unavailable
      - 'off'
  actions:
  - action: notify.mobile_app_julian
    data:
      title: "\U0001F527 Device health digest"
      message: 'Currently offline: {{ ([''binary_sensor.roller_door_contact'', ''binary_sensor.0x54ef4410014ae8c0_contact'',
        ''switch.lane_1_left'', ''switch.lane_1_right'', ''switch.lane_2_left'', ''switch.lane_2_right'',
        ''switch.lane_3_left'', ''switch.lane_3_right'', ''switch.lane_display_tv'']
        | select(''is_state'', ''unavailable'') | map(''state_attr'', ''friendly_name'')
        | reject(''none'') | list + ([''Keypad (offline)''] if states(''binary_sensor.cricket_keypad_online'')
        in [''off'', ''unavailable''] else [])) | join('', '') }}. Zigbee devices
        need a re-pair (permit-join + button); the machine plugs are mesh ROUTERS
        - fixing them stabilises the battery sensors too.'
  mode: single
- id: '1786431319404'
  alias: Watchdog - Backups Stale
  description: Alerts if the Google Drive Backup add-on reports backups stale (binary_sensor.backups_stale
    on) for 2+ hours. Backups are the recovery path for the box-death incident class
    - a silent backup failure would only be discovered when a restore is needed.
  triggers:
  - trigger: state
    entity_id: binary_sensor.backups_stale
    to: 'on'
    for:
      hours: 2
  actions:
  - action: notify.mobile_app_julian
    data:
      title: ⚠️ HA backups STALE
      message: 'Google Drive Backup reports backups are stale (no fresh backup). Last
        successful automatic backup: {{ states(''sensor.backup_last_successful_automatic_backup'')
        }}. Check the add-on before the next outage needs a restore.'
  mode: single
- id: '1786432902360'
  alias: Watchdog - Customer Stuck at Keypad (3 invalid in 5 min)
  description: 'THE incident signature: 2026-07-14 a customer typed her correct-but-never-loaded
    code NINE times and the facility-wide door-code outage stayed silent for 2 hours.
    The keypad validate automation fires keypad_invalid_attempt on every rejected
    PIN; this counts them in a rolling window (mode restart = 5 quiet minutes resets).
    At 3 attempts: snapshots BOTH front-door cameras (intercom + outside_entry CCTV),
    composites them into one image (shell_command.combine_door_snapshots - iOS shows
    a single attachment), CRITICAL push with the composite attached; tap opens the
    Alert Cameras dashboard (door view = live intercom + outside + inside). Catches
    every HA-up code failure in real time.'
  triggers:
  - trigger: event
    event_type: keypad_invalid_attempt
  actions:
  - action: counter.increment
    target:
      entity_id: counter.keypad_invalid_attempts
  - if:
    - condition: numeric_state
      entity_id: counter.keypad_invalid_attempts
      above: 2
    then:
    - action: camera.snapshot
      target:
        entity_id: camera.front_intercom
      data:
        filename: /config/www/keypad_alert_intercom.jpg
      continue_on_error: true
    - action: camera.snapshot
      target:
        entity_id: camera.outside_entry
      data:
        filename: /config/www/keypad_alert_outside.jpg
      continue_on_error: true
    - action: shell_command.combine_door_snapshots
      continue_on_error: true
    - delay: 00:00:02
    - action: notify.mobile_app_julian
      data:
        title: "\U0001F6A8 Someone can't get in"
        message: 3+ invalid keypad attempts in the last 5 min at the front door ({{
          now().strftime('%H:%M') }}). Their code is probably missing from the slots
          - check the Door Codes dashboard. Snapshot = intercom + outside CCTV; tap
          for live door cameras.
        data:
          image: /local/keypad_alert_snapshot.jpg
          url: /alert-cameras/door
          clickAction: /alert-cameras/door
          push:
            sound:
              name: default
              critical: 1
              volume: 1
    - action: counter.reset
      target:
        entity_id: counter.keypad_invalid_attempts
  - delay:
      minutes: 5
  - action: counter.reset
    target:
      entity_id: counter.keypad_invalid_attempts
  mode: restart
- id: '1786432919539'
  alias: Security - After-Hours Person Detected (critical)
  description: Intrusion alerting - previously ZERO. Frigate person detection on any
    INDOOR camera between 22:30 and 05:30 while no booking is active (all 5 bay helpers
    off) sends a CRITICAL push with the triggering camera attached. Outdoor cameras
    deliberately excluded (street traffic false alarms). Bay-helper gate means a legitimate
    late booking (helpers on until end+10) never alarms; staff after hours WILL alarm
    - acceptable, they know the system.
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.cricket_facing_batters_person_occupancy
    - binary_sensor.cricket_facing_bowlers_person_occupancy
    - binary_sensor.pier_facing_bags_person_occupancy
    - binary_sensor.pier_facing_entry_person_occupancy
    - binary_sensor.pier_facing_office_person_occupancy
    - binary_sensor.upstairs_person_occupancy
    to: 'on'
  conditions:
  - condition: time
    after: '22:30:00'
    before: 05:30:00
  - condition: state
    entity_id: input_boolean.bay1_helper
    state: 'off'
  - condition: state
    entity_id: input_boolean.bay2_helper
    state: 'off'
  - condition: state
    entity_id: input_boolean.bay3_helper
    state: 'off'
  - condition: state
    entity_id: input_boolean.bay4_helper
    state: 'off'
  - condition: state
    entity_id: input_boolean.bay5_helper
    state: 'off'
  actions:
  - action: camera.snapshot
    target:
      entity_id: camera.{{ trigger.entity_id.split('.')[1].replace('_person_occupancy',
        '') }}
    data:
      filename: /config/www/intrusion_{{ trigger.entity_id.split('.')[1].replace('_person_occupancy',
        '') }}.jpg
    continue_on_error: true
  - delay: 00:00:02
  - action: notify.mobile_app_julian
    data:
      title: "\U0001F6A8 PERSON INSIDE after hours"
      message: '{{ trigger.to_state.name }} detected a person at {{ now().strftime(''%H:%M:%S'')
        }} with no active booking. Snapshot attached; tap for live cameras.'
      data:
        image: /local/intrusion_{{ trigger.entity_id.split('.')[1].replace('_person_occupancy',
          '') }}.jpg
        url: /alert-cameras/inside
        clickAction: /alert-cameras/inside
        push:
          sound:
            name: default
            critical: 1
            volume: 1
  mode: parallel
  max: 10
- id: '1786432934072'
  alias: Watchdog - Zigbee Network DOWN (Z2M bridge)
  description: Whole-mesh failure alert. If the Zigbee2MQTT bridge connection drops
    for 10+ minutes (Z2M add-on crash, MQTT broker death, coordinator fault), EVERY
    Zigbee device - machine plugs, door contacts, sensors - is dead at once. Without
    this it only surfaces as scattered 30-min per-device dropout alerts; this names
    the real cause in 10 min. Push on down AND recovery.
  triggers:
  - trigger: state
    entity_id: binary_sensor.zigbee2mqtt_bridge_connection_state
    to:
    - 'off'
    - unavailable
    for:
      minutes: 10
    id: down
  - trigger: state
    entity_id: binary_sensor.zigbee2mqtt_bridge_connection_state
    from:
    - 'off'
    - unavailable
    to: 'on'
    id: up
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: down
      sequence:
      - action: notify.mobile_app_julian
        data:
          title: "\U0001F6A8 ZIGBEE NETWORK DOWN"
          message: Zigbee2MQTT bridge offline 10+ min - ALL Zigbee devices dead (machine
            plugs, door contacts, sensors). Check the Z2M add-on / Mosquitto broker.
          data:
            push:
              sound:
                name: default
                critical: 1
                volume: 1
    - conditions:
      - condition: trigger
        id: up
      sequence:
      - action: notify.mobile_app_julian
        data:
          title: ✅ Zigbee network recovered
          message: Zigbee2MQTT bridge back online.
  mode: single
- id: '1786433025349'
  alias: Watchdog - Frigate DOWN (security recording stopped)
  description: 'Frigate add-on death = security recording + person detection silently
    stop (and the new after-hours intrusion alert goes blind). Frigate exposes no
    single status entity, so this watches two independent cameras'' person-occupancy
    sensors: trigger when either is unavailable 30 min AND condition requires BOTH
    unavailable - a single camera being disabled/reconfigured never false-alarms;
    only whole-Frigate death fires.'
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.pier_facing_entry_person_occupancy
    - binary_sensor.cricket_facing_batters_person_occupancy
    to: unavailable
    for:
      minutes: 30
  conditions:
  - condition: state
    entity_id: binary_sensor.pier_facing_entry_person_occupancy
    state: unavailable
  - condition: state
    entity_id: binary_sensor.cricket_facing_batters_person_occupancy
    state: unavailable
  actions:
  - action: notify.mobile_app_julian
    data:
      title: ⚠️ Frigate DOWN - no security recording
      message: 'Frigate camera entities unavailable 30+ min: recording, person detection
        and the after-hours intrusion alert are all dead. Check the Frigate add-on
        (it was throwing DNS/timeout errors after the last reboot).'
  mode: single
- id: '1786433147359'
  alias: Watchdog - Lane Display Pi Down (gentle)
  description: Lane-display Pi (192.168.1.128, DHCP lease - no reservation, Swoop
    router still closed) runs the TV booking board + the door-listener the bookings-TV
    depends on. Down 10+ min -> NORMAL-priority push (deliberately not critical -
    it is a customer-facing display, not safety; kept OUT of the main network watchdog
    whose alerts are all critical-sound). Recovery push included. NB if the Pi's DHCP
    lease ever moves off .128 this probe goes permanently down AND the tv_door_open
    rest_command breaks - get the reservation done.
  triggers:
  - trigger: state
    entity_id: binary_sensor.lane_display_pi_ping
    to: 'off'
    for:
      minutes: 10
    id: down
  - trigger: state
    entity_id: binary_sensor.lane_display_pi_ping
    from: 'off'
    to: 'on'
    id: up
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: down
      sequence:
      - action: notify.mobile_app_julian
        data:
          title: ⚠️ Lane display Pi offline
          message: The lane-display Pi (.128) has been unreachable 10+ min - TV booking
            board + bookings-TV door-open hold are down. Power/WiFi/lease check needed.
          data:
            tag: lane-display-pi
    - conditions:
      - condition: trigger
        id: up
      sequence:
      - action: notify.mobile_app_julian
        data:
          title: ✅ Lane display Pi back
          message: The lane-display Pi is reachable again.
          data:
            tag: lane-display-pi
  mode: single
