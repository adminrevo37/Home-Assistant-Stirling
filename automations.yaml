- id: door_code_exempt_nightly_clear
  alias: Door Code Exempt - Nightly Clear
  description: Clears input_text.door_code_exempt every night at 22:30 so manual standing
    door codes never persist past the day. The reconcile sweep (runs until 23:00)
    then removes the now-unexempted code from its slot within a minute.
  triggers:
  - trigger: time
    at: '22:30:00'
  actions:
  - action: input_text.set_value
    target:
      entity_id: input_text.door_code_exempt
    data:
      value: ''
  mode: single
- id: machine_audit_booking_start
  alias: Machine Audit - Booking Start (capture baseline)
  description: 'At each lane booking start, records the lane''s cumulative machine-minutes
    counter as the baseline and captures the booking context (customer|bookedMinutes|startISO|email)
    into the lane''s audit-booking helper. Paired with Machine Audit - Booking End.
    Built 2026-06-24; email appended 2026-06-25. 2026-07-06: start triggers offset
    +15s so that at a back-to-back boundary the ENDing booking reads its baseline
    before this start overwrites it (fixes earlier-booking used=0 race; ending booking
    is attributed up to its exact end time).'
  triggers:
  - trigger: calendar
    entity_id: calendar.lane_1_bowling_machine
    event: start
    offset: 0:00:15
    id: l1
  - trigger: calendar
    entity_id: calendar.lane_2_bowling_machine
    event: start
    offset: 0:00:15
    id: l2
  - trigger: calendar
    entity_id: calendar.lane_3_truman_or_bowling_machine
    event: start
    offset: 0:00:15
    id: l3
  actions:
  - action: input_number.set_value
    target:
      entity_id: input_number.lane_{{ n }}_audit_baseline
    data:
      value: '{{ states(''sensor.lane_'' ~ n ~ ''_machine_minutes'') | float(0) }}'
  - action: input_text.set_value
    target:
      entity_id: input_text.lane_{{ n }}_audit_booking
    data:
      value: '{{ ctx }}'
  mode: queued
  max: 10
  variables:
    n: '{{ trigger.id[1] }}'
    cust: '{{ (trigger.calendar_event.description or '''') | regex_findall(''Customer:
      (.+)'') | first | default(''Unknown'') | trim }}'
    email: '{{ (trigger.calendar_event.description or '''') | regex_findall(''Email:
      (.+)'') | first | default('''') | trim }}'
    booked: '{{ ((as_datetime(trigger.calendar_event.end) - as_datetime(trigger.calendar_event.start)).total_seconds()
      / 60) | round(0) | int }}'
    ctx: '{{ cust }}|{{ booked }}|{{ trigger.calendar_event.start }}|{{ email }}'
- id: machine_audit_booking_end
  alias: Machine Audit - Booking End (compute + record)
  description: 'At each lane booking end: actual machine-use minutes (counter - baseline),
    util%, logs a ''Machine Audit'' logbook record + Machine Audit Last Record helper,
    and POSTs {ts,lane,customer,email,bookedMin,usedMin,utilPct,startISO} to Krickora
    /ha/usage via shell_command.usage_webhook (HMAC-signed, continue_on_error so logging
    still works if the shell_command/key isn''t wired yet). Then clears the lane''s
    audit-booking helper. Built 2026-06-24; POST wired 2026-06-25.'
  triggers:
  - trigger: calendar
    entity_id: calendar.lane_1_bowling_machine
    event: end
    id: l1
  - trigger: calendar
    entity_id: calendar.lane_2_bowling_machine
    event: end
    id: l2
  - trigger: calendar
    entity_id: calendar.lane_3_truman_or_bowling_machine
    event: end
    id: l3
  conditions:
  - condition: template
    value_template: '{{ (ctx | trim) != '''' }}'
  actions:
  - action: logbook.log
    data:
      name: Machine Audit
      message: '{{ rec }}'
      entity_id: sensor.lane_{{ n }}_machine_minutes
  - action: input_text.set_value
    target:
      entity_id: input_text.machine_audit_last_record
    data:
      value: '{{ rec[:255] }}'
  - action: shell_command.usage_webhook
    data:
      payload: '{{ payload }}'
    continue_on_error: true
  - action: input_text.set_value
    target:
      entity_id: input_text.lane_{{ n }}_audit_booking
    data:
      value: ''
  mode: queued
  max: 10
  variables:
    n: '{{ trigger.id[1] }}'
    counter: '{{ states(''sensor.lane_'' ~ n ~ ''_machine_minutes'') | float(0) }}'
    baseline: '{{ states(''input_number.lane_'' ~ n ~ ''_audit_baseline'') | float(0)
      }}'
    used: '{{ (counter - baseline) | round(1) }}'
    ctx: '{{ states(''input_text.lane_'' ~ n ~ ''_audit_booking'') | default('''')
      }}'
    parts: '{{ ctx.split(''|'') }}'
    cust: '{{ parts[0] if (parts | length) > 0 else ''Unknown'' }}'
    booked: '{{ (parts[1] | float(0)) if (parts | length) > 1 else 0 }}'
    startiso: '{{ parts[2] if (parts | length) > 2 else '''' }}'
    email: '{{ parts[3] if (parts | length) > 3 else '''' }}'
    util: '{{ ((used / booked * 100) | round(0)) if booked > 0 else 0 }}'
    rec: Lane {{ n }} | {{ cust }} | booked {{ booked | int }}m / used {{ used }}m
      ({{ util }}%)
    payload: '{"ts": {{ now().timestamp() | int }}, "lane": {{ n | int }}, "customer":
      {{ cust | tojson }}, "email": {{ email | tojson }}, "bookedMin": {{ booked |
      int }}, "usedMin": {{ used }}, "utilPct": {{ util }}, "startISO": {{ startiso
      | tojson }}}'
- id: roller_door_auto_close_retry
  alias: Roller Door - Auto-Close Retry (3 min -> 2 pulses -> notify Julian)
  description: If binary_sensor.roller_door_contact stays OPEN for 3 min (operator
    30s auto-close failed / door left open), pulse the OPERATE relay (lock.unlock
    on lock.front_door_lock) to close it. Wait up to 20s for the contact to read closed;
    if still open, pulse again; wait another 20s; if STILL open, snapshot camera.pier_facing_entry
    and push Julian with the embedded image. Suppressed while input_boolean.door_service_mode
    (hold-open) is on. Pulse = lock.unlock (proven door OPERATE; lock auto-relocks
    between pulses). Built 2026-07-06.
  triggers:
  - trigger: state
    entity_id: binary_sensor.roller_door_contact
    to: 'on'
    for: 00:03:00
  conditions:
  - condition: state
    entity_id: input_boolean.door_service_mode
    state: 'off'
  - condition: state
    entity_id: input_boolean.team_door_hold
    state: 'off'
  actions:
  - action: lock.unlock
    target:
      entity_id: lock.front_door_lock
  - wait_for_trigger:
    - trigger: state
      entity_id: binary_sensor.roller_door_contact
      to: 'off'
    timeout: 00:00:20
    continue_on_timeout: true
  - if:
    - condition: state
      entity_id: binary_sensor.roller_door_contact
      state: 'off'
    then:
    - stop: Roller door closed after attempt 1
  - action: lock.unlock
    target:
      entity_id: lock.front_door_lock
  - wait_for_trigger:
    - trigger: state
      entity_id: binary_sensor.roller_door_contact
      to: 'off'
    timeout: 00:00:20
    continue_on_timeout: true
  - if:
    - condition: state
      entity_id: binary_sensor.roller_door_contact
      state: 'off'
    then:
    - stop: Roller door closed after attempt 2
  - action: camera.snapshot
    target:
      entity_id: camera.pier_facing_entry
    data:
      filename: /config/www/door_autoclose_snapshot.jpg
  - delay: 00:00:02
  - action: notify.mobile_app_julian
    data:
      title: "\U0001F6A8 Roller Door Won't Close"
      message: The front roller door was open 3 min. HA tried to close it twice and
        it is STILL open - please review the entry.
      data:
        image: /local/door_autoclose_snapshot.jpg
        url: /hassio/ingress/ccab4aaf_frigate/cameras/pier_facing_entry
        clickAction: /hassio/ingress/ccab4aaf_frigate/cameras/pier_facing_entry
  mode: single
  trace:
    stored_traces: 20
- id: notification_log_capture
  alias: Notification Log - Capture pushes to Julian
  description: Intercepts every push sent to Julian (notify.mobile_app_julian and
    notify.notify) and (1) mirrors the latest into a single rolling HA persistent
    notification (the bell) so opening HA shows what the last push was + why, (2)
    writes a timestamped Logbook history against input_text.last_ha_notification,
    (3) stores the latest text in that helper for a dashboard tile. Captures without
    editing the ~13 alert automations. Built 2026-07-06.
  triggers:
  - trigger: event
    event_type: call_service
    event_data:
      domain: notify
      service: mobile_app_julian
    id: julian
  - trigger: event
    event_type: call_service
    event_data:
      domain: notify
      service: notify
    id: broad
  actions:
  - action: input_text.set_value
    target:
      entity_id: input_text.last_ha_notification
    data:
      value: '{{ (now().strftime(''%H:%M'') ~ ''  '' ~ title ~ '': '' ~ message)[:255]
        }}'
  - action: logbook.log
    data:
      name: Push to Julian
      message: '{{ title }} - {{ message }} (via notify.{{ svc }})'
      entity_id: input_text.last_ha_notification
  - action: persistent_notification.create
    data:
      notification_id: last_ha_push
      title: 'Last push: {{ title }}'
      message: '{{ message }}


        ---

        Sent {{ stamp }} via notify.{{ svc }}

        (This is the most recent push to your phone. Full history: Logbook -> filter
        ''Last HA Notification''.)'
  mode: queued
  max: 30
  variables:
    title: '{{ trigger.event.data.service_data.title | default(''Notification'', true)
      }}'
    message: '{{ trigger.event.data.service_data.message | default(''(no message)'',
      true) }}'
    svc: '{{ trigger.event.data.service }}'
    stamp: '{{ now().strftime(''%a %d %b %-I:%M %p'') }}'
  trace:
    stored_traces: 20
- id: team_booking_door_open
  alias: Team Booking - Auto-Open Door (tagged bookings)
  description: 15 min before a TEAM booking start (calendar event description contains
    'AUTO-DOOR', added by Krickora for Balcatta CC + Paolo Sat 4-6pm etc.), opens
    the roller door and stops it just short of full-open (script.team_door_open_short)
    so the operator's 30s auto-close doesn't take over. Sets input_boolean.team_door_hold
    (suppresses roller-door alerts) + input_datetime.team_door_close_at = booking
    start + 5 min (the Auto-Close Door automation shuts it then). Dedupes multi-lane
    team bookings via the team_door_hold guard + mode single. Assumes the door is
    CLOSED at T-15. Built 2026-07-07.
  triggers:
  - trigger: calendar
    entity_id: calendar.lane_1_bowling_machine
    event: start
    offset: -0:15:00
    id: l1
  - trigger: calendar
    entity_id: calendar.lane_2_bowling_machine
    event: start
    offset: -0:15:00
    id: l2
  - trigger: calendar
    entity_id: calendar.lane_3_truman_or_bowling_machine
    event: start
    offset: -0:15:00
    id: l3
  - trigger: calendar
    entity_id: calendar.lane_4_run_up_net
    event: start
    offset: -0:15:00
    id: l4
  - trigger: calendar
    entity_id: calendar.lane_5_run_up_net
    event: start
    offset: -0:15:00
    id: l5
  conditions:
  - condition: template
    value_template: '{{ ''AUTO-DOOR'' in (trigger.calendar_event.description | default(''''))
      }}'
  - condition: state
    entity_id: input_boolean.team_door_hold
    state: 'off'
  actions:
  - action: input_datetime.set_datetime
    target:
      entity_id: input_datetime.team_door_close_at
    data:
      datetime: '{{ (as_local(as_datetime(trigger.calendar_event.start)) + timedelta(minutes=5)).strftime(''%Y-%m-%d
        %H:%M:%S'') }}'
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.team_door_hold
  - action: logbook.log
    data:
      name: Team Door
      message: Auto-open for team booking '{{ trigger.calendar_event.summary }}' (start
        {{ trigger.calendar_event.start }}); close at {{ states('input_datetime.team_door_close_at')
        }}.
      entity_id: input_boolean.team_door_hold
  - action: script.team_door_open_short
  mode: single
  trace:
    stored_traces: 20
- id: team_booking_door_close
  alias: Team Booking - Auto-Close Door
  description: While a team-booking door hold is active (input_boolean.team_door_hold
    on), once now reaches team_door_close_at (booking start + 5 min) pulse the roller
    door to CLOSE, then clear the hold (restores roller-door alerts). Per-minute check
    = restart-safe (survives an HA restart mid-hold). Only pulses close if the door
    is actually OPEN (binary_sensor.roller_door_contact on) - if the operator's auto-close
    already shut it, just clears the hold without re-opening. Built 2026-07-07.
  triggers:
  - trigger: time_pattern
    minutes: /1
  conditions:
  - condition: state
    entity_id: input_boolean.team_door_hold
    state: 'on'
  - condition: template
    value_template: '{{ now().timestamp() >= (state_attr(''input_datetime.team_door_close_at'',''timestamp'')
      | float(0)) }}'
  actions:
  - if:
    - condition: state
      entity_id: binary_sensor.roller_door_contact
      state: 'on'
    then:
    - action: lock.unlock
      target:
        entity_id: lock.front_door_lock
  - action: logbook.log
    data:
      name: Team Door
      message: Hold ended - door {{ 'pulsed closed' if is_state('binary_sensor.roller_door_contact','on')
        else 'was already closed' }}; alerts restored.
      entity_id: input_boolean.team_door_hold
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.team_door_hold
  mode: single
  trace:
    stored_traces: 20
- id: lane_display_tv_power
  alias: Lane Display TV - Power (booking window)
  description: Powers the lane-display TV's Zigbee plug (switch.lane_display_tv) ON
    from ~25 min before the day's first lane booking to ~15 min after the day's last,
    OFF otherwise. Slightly wider than the Pi's CEC on-window so the TV always has
    clean power when the board should show. With the TV set to 'Power On Mode = On',
    re-powering turns it on without CEC - the durable fix for the Falcon deep-standby
    issue. Per-5-min + on-HA-start = restart-safe. Built 2026-07-08.
  triggers:
  - trigger: time_pattern
    minutes: /5
  - trigger: homeassistant
    event: start
  actions:
  - action: calendar.get_events
    target:
      entity_id:
      - calendar.lane_1_bowling_machine
      - calendar.lane_2_bowling_machine
      - calendar.lane_3_truman_or_bowling_machine
      - calendar.lane_4_run_up_net
      - calendar.lane_5_run_up_net
    data:
      start_date_time: '{{ today_at(''00:00'') }}'
      end_date_time: '{{ today_at(''23:59:59'') }}'
    response_variable: tv_events
  - variables:
      want_on: '{% set ns = namespace(starts=[], ends=[]) %}{% for cal, d in tv_events.items()
        %}{% for e in (d.events | default([])) %}{% set s = e.start.dateTime if (e.start
        is mapping) else e.start %}{% set en = e.end.dateTime if (e.end is mapping)
        else e.end %}{% set ns.starts = ns.starts + [as_datetime(s)] %}{% set ns.ends
        = ns.ends + [as_datetime(en)] %}{% endfor %}{% endfor %}{% if ns.starts |
        count == 0 %}false{% else %}{{ (now() >= (ns.starts | min) - timedelta(minutes=25))
        and (now() <= (ns.ends | max) + timedelta(minutes=15)) }}{% endif %}'
  - if:
    - condition: template
      value_template: '{{ want_on | bool(false) }}'
    then:
    - action: switch.turn_on
      target:
        entity_id: switch.lane_display_tv
    else:
    - action: switch.turn_off
      target:
        entity_id: switch.lane_display_tv
  mode: single
  trace:
    stored_traces: 20
- id: highbay_clear_stranded_neighbours
  alias: Highbays - Clear Stranded Neighbour Lights
  description: 'Fixes the dawn-transition strand: neighbour highbays are lit while
    dark (incl. pre-sunrise bookings) but the bay-end automations only clear them
    in the evening (''after sunset''), so a pre-dawn booking''s neighbour lights never
    got cleared after sunrise. On any booking end (bay helper -> off), turns OFF each
    highbay only if EVERY lane feeding it (its own lane + the lanes it neighbours)
    has no active booking. Guarded so it never turns off a light an active booking
    needs; skipped in busy mode; does NOT touch manually-lit lights (only runs at
    booking end). Highbay 3 (night residual) is only cleared while the sun is up.
    Built 2026-07-09.'
  triggers:
  - trigger: state
    entity_id:
    - input_boolean.bay1_helper
    - input_boolean.bay2_helper
    - input_boolean.bay3_helper
    - input_boolean.bay4_helper
    - input_boolean.bay5_helper
    to: 'off'
  conditions:
  - condition: state
    entity_id: input_boolean.lighting_all_lanes_active
    state: 'off'
  actions:
  - delay: 00:00:02
  - if:
    - condition: state
      entity_id:
      - input_boolean.bay1_helper
      - input_boolean.bay2_helper
      state: 'off'
    then:
    - action: light.turn_off
      target:
        entity_id: light.highbay_1
  - if:
    - condition: state
      entity_id:
      - input_boolean.bay1_helper
      - input_boolean.bay2_helper
      - input_boolean.bay3_helper
      state: 'off'
    then:
    - action: light.turn_off
      target:
        entity_id: light.highbay_2
  - if:
    - condition: state
      entity_id:
      - input_boolean.bay2_helper
      - input_boolean.bay3_helper
      - input_boolean.bay4_helper
      state: 'off'
    - condition: state
      entity_id: sun.sun
      state: above_horizon
    then:
    - action: light.turn_off
      target:
        entity_id: light.highbay_3
  - if:
    - condition: state
      entity_id:
      - input_boolean.bay3_helper
      - input_boolean.bay4_helper
      - input_boolean.bay5_helper
      state: 'off'
    then:
    - action: light.turn_off
      target:
        entity_id: light.highbay_4
  - if:
    - condition: state
      entity_id:
      - input_boolean.bay4_helper
      - input_boolean.bay5_helper
      state: 'off'
    then:
    - action: light.turn_off
      target:
        entity_id: light.highbay_5
  mode: single
  trace:
    stored_traces: 20
- id: highbay_reconcile_after_control4_recovery
  alias: Highbays - Reconcile after Control4 recovery
  description: Fixes highbay light drift from the recurring multi-minute Control4
    dropouts. When C4 recovers (its highbay entities return from 'unavailable' after
    the feed reloads), or on HA start, or when the Reconcile Bay Lights button is
    pressed, it re-derives all highbay lights from the current bookings via script.reconcile_highbay_lights.
    (During a C4 outage the calendar bay start/end automations still set the HA-side
    bay helpers correctly, but their light commands are lost - this re-applies them.)
    Door codes + machine plugs already self-reconcile separately. Built 2026-07-09.
  triggers:
  - trigger: state
    entity_id:
    - light.highbay_1
    - light.highbay_2
    - light.highbay_3
    - light.highbay_4
    - light.highbay_5
    from: unavailable
    id: recovery
  - trigger: homeassistant
    event: start
    id: start
  - trigger: state
    entity_id: input_button.reconcile_bay_lights
    id: manual
  actions:
  - if:
    - condition: template
      value_template: '{{ trigger.id != ''manual'' }}'
    then:
    - delay: 00:00:10
  - action: script.reconcile_highbay_lights
  - action: logbook.log
    data:
      name: Bay Reconcile
      message: 'Reconciled highbay lights to current bookings (trigger: {{ trigger.id
        }}).'
      entity_id: light.highbay_1
  mode: single
  trace:
    stored_traces: 20
