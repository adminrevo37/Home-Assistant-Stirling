  - trigger: calendar
    entity_id: calendar.lane_1_bowling_machine
    event: start
    offset: -0:10:00
    id: cust_start
  - trigger: calendar
    entity_id: calendar.lane_1_bowling_machine
    event: end
    offset: 0:10:00
    id: cust_end
  - trigger: calendar
    entity_id: calendar.lane_1_bowling_machine
    event: end
    offset: 0:10:00
    id: coach_end
  actions:
  - choose:
    - conditions:
      - '{{ (trigger.id == ''coach_start'' and is_coach) or (trigger.id == ''cust_start''
        and is_customer) }}'
      sequence:
      - action: switch.turn_on
        target:
          entity_id: '{{ plugs_to_on }}'
    - conditions:
      - '{{ (trigger.id == ''coach_end'' and is_coach) or (trigger.id == ''cust_end''
        and is_customer) }}'
      sequence:
      - action: homeassistant.update_entity
        target:
          entity_id: calendar.lane_1_bowling_machine
      - delay: 00:00:02
      - action: calendar.get_events
        target:
          entity_id: calendar.lane_1_bowling_machine
        data:
          start_date_time: '{{ (now() - timedelta(minutes=1)).isoformat() }}'
          end_date_time: '{{ (now() + timedelta(minutes=12)).isoformat() }}'
        response_variable: up
      - if:
        - '{{ (up[''calendar.lane_1_bowling_machine''].events | default([])) | count
          == 0 }}'
        then:
        - action: switch.turn_off
          target:
            entity_id:
            - switch.lane_1_left
            - switch.lane_1_right
  mode: queued
  max: 10
  variables:
    is_coach: '{{ ''Coach Session'' in (trigger.calendar_event.description | default(''''))
      }}'
    is_customer: '{{ ''Net Session'' in (trigger.calendar_event.description | default(''''))
      }}'
    plugs_to_on: '{% set d = trigger.calendar_event.description | default('''') %}{%
      set is_coach = ''Coach Session'' in d %}{% set is_customer = ''Net Session''
      in d %}{% set tl = states(''input_select.truman_location'') %}{% set here =
      tl in [''Lane 1 Left'',''Lane 1 Right''] %}{% set paid = ''(Truman)'' in d %}{%
      if (not here) or is_coach or (is_customer and paid) %}switch.lane_1_left,switch.lane_1_right{%
      else %}{{ ''switch.lane_1_right'' if tl == ''Lane 1 Left'' else ''switch.lane_1_left''
