- id: auto_git_push
  alias: Auto Push Config to GitHub
  description: Nightly 2am push of HA config changes to GitHub
  triggers:
  - trigger: time
    at: 02:00:00
  actions:
  - action: shell_command.git_push
    response_variable: push_result
  - if:
    - condition: template
      value_template: '{{ push_result.returncode != 0 }}'
    then:
    - action: persistent_notification.create
      data:
        title: GitHub Push Failed
        message: 'Auto-push to GitHub failed at 2am. Your PAT token may have expired.
          Error: {{ push_result.stderr }}

          '
  mode: single
- id: github_deploy_webhook
  alias: Deploy from GitHub
  description: Pulls latest config from GitHub when a push is made to the repo
  triggers:
  - trigger: webhook
    webhook_id: 7k2p9x4m3n8q1r5f
    local_only: false
  actions:
  - action: shell_command.git_pull
  - delay: 00:00:05
  - action: homeassistant.reload_all
  mode: single
- id: sunset_neighbour_activate
  alias: Sunset - Activate Neighbour Highbays
  description: '30 min before sunset: for any active booking, turn on neighbour highbays.
    Bay 1: +hb2 | Bay 2: +hb1,hb3 | Bay 3: +hb2,hb4 | Bay 4: +hb3,hb5 | Bay 5: +hb4

    '
  triggers:
  - trigger: sun
    event: sunset
    offset: -0:30:00
  actions:
  - if:
    - condition: state
      entity_id: input_boolean.bay1_helper
      state: 'on'
    then:
    - action: light.turn_on
      target:
        entity_id: light.highbay_2
  - if:
    - condition: state
      entity_id: input_boolean.bay2_helper
      state: 'on'
    then:
    - action: light.turn_on
      target:
        entity_id:
        - light.highbay_1
        - light.highbay_3
  - if:
    - condition: state
      entity_id: input_boolean.bay3_helper
      state: 'on'
    then:
    - action: light.turn_on
      target:
        entity_id:
        - light.highbay_2
        - light.highbay_4
  - if:
    - condition: state
      entity_id: input_boolean.bay4_helper
      state: 'on'
    then:
    - action: light.turn_on
      target:
        entity_id:
        - light.highbay_3
        - light.highbay_5
  - if:
    - condition: state
      entity_id: input_boolean.bay5_helper
      state: 'on'
    then:
    - action: light.turn_on
      target:
        entity_id: light.highbay_4
  mode: single
- id: night_staggered_shutdown
  alias: Night - All Off + Highbay 3 Residual
  description: 'When all 5 bay helpers are off after dark: check for upcoming bookings
    within 30 min. If gap >30 min, turn off highbays 1/2/4/5 and keep highbay 3 on
    as the residual safety light. If a booking starts within 30 min, skip shutdown
    to avoid a dark gap. GATED on input_boolean.control4_ready (added 2026-07-28):
    skips while a power-outage boot recovery is in progress so it can''t turn off
    the fail-bright lights.'
  triggers:
  - trigger: state
    entity_id:
    - input_boolean.bay1_helper
    - input_boolean.bay2_helper
    - input_boolean.bay3_helper
    - input_boolean.bay4_helper
    - input_boolean.bay5_helper
    to: 'off'
  conditions:
  - condition: state
    entity_id: input_boolean.control4_ready
    state: 'on'
  - condition: sun
    after: sunset
    after_offset: -00:30:00
  - condition: state
    entity_id:
    - input_boolean.bay1_helper
    - input_boolean.bay2_helper
    - input_boolean.bay3_helper
    - input_boolean.bay4_helper
    - input_boolean.bay5_helper
    state: 'off'
  actions:
  - action: calendar.get_events
    target:
      entity_id:
      - calendar.lane_1_bowling_machine
      - calendar.lane_2_bowling_machine
      - calendar.lane_3_truman_or_bowling_machine
      - calendar.lane_4_run_up_net
      - calendar.lane_5_run_up_net
    data:
      start_date_time: '{{ now().isoformat() }}'
      end_date_time: '{{ (now() + timedelta(minutes=30)).isoformat() }}'
    response_variable: upcoming_30min
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ upcoming_30min.values() | map(attribute=''events'') |
          sum(start=[]) | count == 0 }}'
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.lighting_all_lanes_active
      - action: light.turn_off
        target:
          entity_id:
          - light.highbay_1
          - light.highbay_2
          - light.highbay_4
          - light.highbay_5
      - action: light.turn_on
        target:
          entity_id: light.highbay_3
    default:
    - action: logbook.log
      data:
        name: Night Shutdown
        message: Shutdown skipped — booking starting within 30 min, keeping lights
          on.
  mode: single
- id: night_highbay3_off
  alias: Night - Highbay 3 Residual Off
  description: After dark with no active bookings, turn off residual highbay 3 once
    occupancy drops below the configured threshold. Re-checking (threshold-cross +
    every 5 min) so an already-empty building is always caught.
  triggers:
  - trigger: numeric_state
    entity_id: sensor.main_occupancy_probability
    below: input_number.lighting_occupancy_threshold
  - trigger: time_pattern
    minutes: /5
  conditions:
  - condition: sun
    after: sunset
    after_offset: -00:30:00
  - condition: state
    entity_id:
    - input_boolean.bay1_helper
    - input_boolean.bay2_helper
    - input_boolean.bay3_helper
    - input_boolean.bay4_helper
    - input_boolean.bay5_helper
    state: 'off'
