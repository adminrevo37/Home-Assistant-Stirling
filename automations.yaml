  alias: C4 Entry Log - Poll Every Minute
  triggers:
  - trigger: time_pattern
    minutes: /1
  actions:
  - action: shell_command.c4_entry_log
- id: door_visual_sensor_poll
  alias: Roller Door - Visual Sensor Poll
  description: 'Every 15 s: snapshot pier_facing_entry camera, run c4_door_visual.py,
    update input_boolean.roller_door_visual_open.

    '
  triggers:
  - trigger: time_pattern
    seconds: /15
  actions:
  - action: camera.snapshot
    target:
      entity_id: camera.pier_facing_entry
    data:
      filename: /config/www/door_check_latest.jpg
  - action: shell_command.c4_door_visual_check
    response_variable: visual_result
  - if:
    - condition: template
      value_template: '{{ ''open'' in (visual_result.stdout | default('''')) }}'
    then:
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.roller_door_visual_open
    else:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.roller_door_visual_open
  mode: single
- id: roller_door_opened_notify
  alias: Roller Door - Notify Staff on Open
  description: 'Notifies staff ONLY if the front roller door is left open for 3 minutes
    continuously (no longer pushes on every open). Changed 2026-06-08 per Inspector:
    per-open push disabled, threshold 3s -> 3min; added service-mode suppression to
    match the failed-to-close alert. Uses binary_sensor.roller_door_contact.'
  triggers:
  - entity_id: binary_sensor.roller_door_contact
    from: 'off'
    to: 'on'
    for: 00:03:00
    platform: state
  conditions:
  - condition: state
    entity_id: input_boolean.door_service_mode
    state: 'off'
  actions:
  - action: notify.notify
    data:
      title: "\U0001F6AA Roller Door Left Open"
      message: The front roller door has been open for 3 minutes.
  mode: single
- id: roller_door_auto_close
  alias: Roller Door - Auto Close + Alert if Left Open
  description: "After door opens: two LOCK+UNLOCK close attempts then a snapshot +
    staff alert. LOCK resets C4 state; UNLOCK triggers the motor (toggle close from
    open limit). Timings are configurable via:\n  input_number.door_close_attempt1_secs
    \ (calibrated 60s = 19s motor travel + 41s entry buffer)\n  input_number.door_close_attempt2_secs
    \ (calibrated 35s after attempt 1 — ensures visual sensor has updated after close)\n
    \ input_number.door_close_alert_secs     (calibrated 20s after attempt 2)\nTotal
    window = 115s. Mode restart: resets if door reopens.\n"
  triggers:
  - trigger: state
    entity_id: input_boolean.roller_door_visual_open
    to: 'on'
  actions:
  - condition: state
    entity_id: input_boolean.door_service_mode
    state: 'off'
  - delay:
      seconds: '{{ states(''input_number.door_close_attempt1_secs'') | int(75) }}'
  - condition: state
    entity_id: input_boolean.roller_door_visual_open
    state: 'on'
  - action: shell_command.c4_lock_door
  - delay: 00:00:01
  - action: shell_command.c4_unlock_door
  - delay:
      seconds: '{{ states(''input_number.door_close_attempt2_secs'') | int(25) }}'
  - condition: state
    entity_id: input_boolean.roller_door_visual_open
    state: 'on'
  - action: shell_command.c4_lock_door
  - delay: 00:00:01
  - action: shell_command.c4_unlock_door
  - delay:
      seconds: '{{ states(''input_number.door_close_alert_secs'') | int(20) }}'
  - condition: state
    entity_id: input_boolean.roller_door_visual_open
    state: 'on'
  - action: camera.snapshot
    target:
      entity_id: camera.pier_facing_entry
    data:
      filename: /config/www/door_alert_snapshot.jpg
  - delay: 00:00:02
  - action: notify.notify
    data:
      title: "\U0001F6A8 Front Door Open 2 Min"
      message: The front roller door has been open for 2 minutes. Please check entry.
      data:
        image: /local/door_alert_snapshot.jpg
  mode: restart
- id: '1780070397691'
  alias: Night - Activate Neighbour Highbays on Bay Start
  description: 'Safety net: when any bay_helper turns ON during dusk/night (sun within
    45 min of setting or already set), immediately activate the correct neighbour
    highbays. Closes race condition where booking_start fires just outside the 30-min
    night window. Idempotent — turning on an already-on light has no effect.'
  triggers:
  - trigger: state
    entity_id:
    - input_boolean.bay1_helper
    - input_boolean.bay2_helper
    - input_boolean.bay3_helper
    - input_boolean.bay4_helper
    - input_boolean.bay5_helper
    to: 'on'
  conditions:
  - condition: template
    value_template: '{{ is_state(''sun.sun'', ''below_horizon'') or (is_state(''sun.sun'',
      ''above_horizon'') and (as_timestamp(state_attr(''sun.sun'', ''next_setting''))
      - as_timestamp(now())) < 2700) }}'
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.entity_id == ''input_boolean.bay1_helper'' }}'
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.highbay_2
    - conditions:
      - condition: template
        value_template: '{{ trigger.entity_id == ''input_boolean.bay2_helper'' }}'
      sequence:
      - action: light.turn_on
        target:
          entity_id:
          - light.highbay_1
          - light.highbay_3
    - conditions:
      - condition: template
        value_template: '{{ trigger.entity_id == ''input_boolean.bay3_helper'' }}'
      sequence:
      - action: light.turn_on
        target:
          entity_id:
          - light.highbay_2
          - light.highbay_4
    - conditions:
      - condition: template
        value_template: '{{ trigger.entity_id == ''input_boolean.bay4_helper'' }}'
      sequence:
      - action: light.turn_on
        target:
          entity_id:
          - light.highbay_3
          - light.highbay_5
    - conditions:
      - condition: template
        value_template: '{{ trigger.entity_id == ''input_boolean.bay5_helper'' }}'
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.highbay_4
  mode: parallel
  max: 5
- id: '1780149350644'
  alias: Common Lights - On (Front Door Opened)
  description: 'Front door unlocked (booking code entry / exit button) -> turn on
    common lights. Primary arrival trigger; occupancy>threshold is the backstop. NOTE:
    assumes a DS3 code entry surfaces as lock.front_door_lock -> unlocked; verify
    on-site.'
  triggers:
  - trigger: state
    entity_id: lock.front_door_lock
    to: unlocked
  actions:
  - action: light.turn_on
    target:
      entity_id:
      - light.inside_wall_lights
      - light.fluro_x_4
      - light.mezzanine_wall_lights
  mode: single
- id: '1780149352883'
  alias: Common Lights - On (Occupancy Rises)
  description: Occupancy rises above the configured threshold -> ensure common lights
    on. Backstop to door-open arrival trigger.
  triggers:
  - trigger: numeric_state
    entity_id: sensor.main_occupancy_probability
    above: input_number.lighting_occupancy_threshold
  actions:
  - action: light.turn_on
    target:
      entity_id:
      - light.inside_wall_lights
      - light.fluro_x_4
      - light.mezzanine_wall_lights
  mode: single
- id: '1780149356921'
  alias: Common Lights - Off (Empty + No Booking)
  description: Occupancy at/below threshold AND no active booking AND no booking starting
    within the pre-booking protect window -> turn off common lights. Re-checking (debounced
    threshold-cross + every 5 min) catches an already-empty building. Booking-active
    guard + pre-booking window guard keep common lights on for an early-arriving customer
    who has sat still (occupancy decays).
  triggers:
  - entity_id: sensor.main_occupancy_probability
    below: input_number.lighting_occupancy_threshold
    for:
      minutes: '{{ states(''input_number.lighting_common_off_debounce_min'') | int(4)
        }}'
    platform: numeric_state
  - minutes: /5
    platform: time_pattern
  conditions:
  - condition: numeric_state
    entity_id: sensor.main_occupancy_probability
    below: input_number.lighting_occupancy_threshold
  - condition: state
    entity_id:
    - calendar.lane_1_bowling_machine
    - calendar.lane_2_bowling_machine
    - calendar.lane_3_truman_or_bowling_machine
    - calendar.lane_4_run_up_net
    - calendar.lane_5_run_up_net
    state: 'off'
  - condition: template
    alias: No booking starts within the pre-booking protect window
    value_template: '{% set win = states(''input_number.lighting_pre_booking_protect_window_min'')
      | int(30) %}{% set cals = [''calendar.lane_1_bowling_machine'',''calendar.lane_2_bowling_machine'',''calendar.lane_3_truman_or_bowling_machine'',''calendar.lane_4_run_up_net'',''calendar.lane_5_run_up_net'']
      %}{% set ns = namespace(imminent=false) %}{% for c in cals %}{% set st = state_attr(c,
      ''start_time'') %}{% if st is not none %}{% set secs = as_timestamp(as_datetime(st))
      - as_timestamp(now()) %}{% if secs > 0 and secs <= (win * 60) %}{% set ns.imminent
      = true %}{% endif %}{% endif %}{% endfor %}{{ not ns.imminent }}'
  actions:
  - action: light.turn_off
    target:
      entity_id:
      - light.inside_wall_lights
      - light.fluro_x_4
      - light.mezzanine_wall_lights
  mode: single
- id: '1780149360935'
  alias: Lighting - End-of-Day Hard Off (after last booking)
  description: SUPERSEDED/DISABLED 2026-06-02. Highbays REMOVED from this automation
    - bay lights now follow calendar only (per-bay START/END) + the 23:00 Absolute
    All-Off Catch-All; they are never occupancy-controlled. This now targets COMMON
    lights only and is redundant with 'Common Lights - Off' (kept disabled as a backstop).
    Pre-booking protect guard added so it is safe if ever re-enabled. Recommend deletion
    after review.
  triggers:
  - entity_id:
    - calendar.lane_1_bowling_machine
    - calendar.lane_2_bowling_machine
    - calendar.lane_3_truman_or_bowling_machine
    - calendar.lane_4_run_up_net
    - calendar.lane_5_run_up_net
    to: 'off'
    for:
      minutes: '{{ states(''input_number.lighting_endofday_delay_min'') | int(30)
        }}'
    platform: state
  - platform: time_pattern
    minutes: /5
  conditions:
  - condition: state
    entity_id:
    - calendar.lane_1_bowling_machine
    - calendar.lane_2_bowling_machine
    - calendar.lane_3_truman_or_bowling_machine
    - calendar.lane_4_run_up_net
    - calendar.lane_5_run_up_net
    state: 'off'
  - condition: numeric_state
    entity_id: sensor.main_occupancy_probability
    below: input_number.lighting_occupancy_threshold
  - condition: template
    alias: No booking starts within the pre-booking protect window
    value_template: '{% set win = states(''input_number.lighting_pre_booking_protect_window_min'')
      | int(30) %}{% set cals = [''calendar.lane_1_bowling_machine'',''calendar.lane_2_bowling_machine'',''calendar.lane_3_truman_or_bowling_machine'',''calendar.lane_4_run_up_net'',''calendar.lane_5_run_up_net'']
      %}{% set ns = namespace(imminent=false) %}{% for c in cals %}{% set st = state_attr(c,
      ''start_time'') %}{% if st is not none %}{% set secs = as_timestamp(as_datetime(st))
      - as_timestamp(now()) %}{% if secs > 0 and secs <= (win * 60) %}{% set ns.imminent
      = true %}{% endif %}{% endif %}{% endfor %}{{ not ns.imminent }}'
  actions:
  - action: light.turn_off
    target:
      entity_id:
      - light.inside_wall_lights
      - light.fluro_x_4
      - light.mezzanine_wall_lights
  mode: single
- id: '1780149364218'
  alias: Lighting - Absolute All-Off Catch-All
  description: 'Absolute backstop: at the configured catch-all time (default 23:00),
    force all highbays + common lights off regardless of state. Covers zero-booking
    days and any night the dynamic hard-off did not arm.'
  triggers:
  - trigger: time
    at: input_datetime.lighting_hard_off_catchall
  actions:
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.lighting_all_lanes_active
  - action: light.turn_off
    target:
      entity_id:
      - light.highbay_1
      - light.highbay_2
      - light.highbay_3
      - light.highbay_4
      - light.highbay_5
      - light.inside_wall_lights
      - light.fluro_x_4
      - light.mezzanine_wall_lights
  mode: single
- id: '1780149365937'
  alias: Office Lights - Scheduled Off Sweep
  description: At the three configured times (default 18:00/20:00/22:00) turn off
    office downlights - catches staff leaving them on. Default hard-off (no occupancy
    guard; binary_sensor.pier_facing_office_all_occupancy available if a guard is
    wanted later).
  triggers:
  - trigger: time
    at: input_datetime.office_off_1
  - trigger: time
    at: input_datetime.office_off_2
  - trigger: time
    at: input_datetime.office_off_3
  actions:
  - action: light.turn_off
    target:
      entity_id: light.office_downlights
  mode: single
- id: '1780149372942'
  alias: Exterior Lights - Manage (Stay On / Off)
  description: 'Every 15 min: keep exterior on while a booking is active and it''s
    dark; turn exterior off when no booking is active (~15 min departure buffer).
    Only acts in the dark / when already on.'
  triggers:
  - trigger: time_pattern
    minutes: /15
  actions:
  - choose:
    - conditions:
      - condition: sun
        after: sunset
      - condition: or
        conditions:
        - condition: state
          entity_id: calendar.lane_1_bowling_machine
          state: 'on'
        - condition: state
          entity_id: calendar.lane_2_bowling_machine
          state: 'on'
        - condition: state
          entity_id: calendar.lane_3_truman_or_bowling_machine
          state: 'on'
        - condition: state
          entity_id: calendar.lane_4_run_up_net
          state: 'on'
        - condition: state
          entity_id: calendar.lane_5_run_up_net
          state: 'on'
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.outside_wall_lights
    - conditions:
      - condition: state
        entity_id:
        - calendar.lane_1_bowling_machine
        - calendar.lane_2_bowling_machine
        - calendar.lane_3_truman_or_bowling_machine
        - calendar.lane_4_run_up_net
        - calendar.lane_5_run_up_net
        state: 'off'
      - condition: state
        entity_id: light.outside_wall_lights
        state: 'on'
      sequence:
      - action: light.turn_off
        target:
          entity_id: light.outside_wall_lights
  mode: single
- id: '1780149384391'
  alias: Exterior Lights - On (Before Booking, Dark Only)
  description: 12 min before any booking start, if dark (sun below horizon), turn
    on the outside wall lights.
  triggers:
  - trigger: calendar
    event: start
    entity_id: calendar.lane_1_bowling_machine
    offset: -0:12:00
  - trigger: calendar
    event: start
    entity_id: calendar.lane_2_bowling_machine
    offset: -0:12:00
  - trigger: calendar
    event: start
    entity_id: calendar.lane_3_truman_or_bowling_machine
    offset: -0:12:00
  - trigger: calendar
    event: start
    entity_id: calendar.lane_4_run_up_net
    offset: -0:12:00
  - trigger: calendar
    event: start
    entity_id: calendar.lane_5_run_up_net
    offset: -0:12:00
  conditions:
  - condition: sun
    after: sunset
  actions:
  - action: light.turn_on
    target:
      entity_id: light.outside_wall_lights
  mode: single
- id: temp_clear_keypad_test_slot12
  alias: TEMP - Clear keypad test code slot 12
  description: 'One-shot: clears the manual keypad-test code from DS3 slot 12 at 17:23
    AWST, then disables itself. Created for on-site door-code test 2026-05-31.'
  triggers:
  - trigger: time
    at: '17:23:00'
  conditions: []
  actions:
  - action: shell_command.c4_clear_code
    data:
      slot: '12'
  - action: persistent_notification.create
    data:
      title: Keypad test code cleared
      message: Slot 12 (code 8164) auto-cleared from the DS3 at 17:23. This temp automation
        has disabled itself.
  - action: automation.turn_off
    target:
      entity_id: automation.temp_clear_keypad_test_code_slot_12
  mode: single
- id: roller_door_failed_to_close
  alias: Roller Door - Left Open Escalation (3/5/10 min)
  description: 'Escalating fault alert on binary_sensor.roller_door_contact staying
    OPEN. 3min = broad push to all (notify.notify) + snapshot, ''auto-close likely
    failed''. 5min & 10min = CRITICAL alert to Julian''s iPhone at max volume (bypasses
    silent/DND) + snapshot. Suppressed in service/hold-open mode. Reworked 2026-06-08
    per Inspector: 3/5/10 ladder, 5+10 critical-to-Julian.'
  triggers:
  - platform: state
    entity_id: binary_sensor.roller_door_contact
    to: 'on'
    for: 00:03:00
    id: 3min
  - platform: state
    entity_id: binary_sensor.roller_door_contact
    to: 'on'
    for: 00:05:00
    id: 5min
  - platform: state
    entity_id: binary_sensor.roller_door_contact
    to: 'on'
    for: 00:10:00
    id: 10min
  conditions:
  - condition: state
    entity_id: input_boolean.door_service_mode
    state: 'off'
  actions:
  - action: camera.snapshot
    target:
      entity_id: camera.pier_facing_entry
    data:
      filename: /config/www/door_alert_snapshot.jpg
  - delay: 00:00:02
  - choose:
    - conditions:
      - condition: trigger
        id: 3min
      sequence:
      - action: notify.notify
        data:
          title: "\U0001F6A8 Roller Door Failed to Close"
          message: The front roller door has been open for 3 minutes — the operator
            auto-close may have failed (obstruction, safety-beam fault, or power).
            Please check the entry.
          data:
            image: /local/door_alert_snapshot.jpg
    - conditions:
      - condition: trigger
        id: 5min
      sequence:
      - action: notify.mobile_app_julian
        data:
          title: "\U0001F6A8 Roller Door Still Open — 5 min"
          message: The front roller door is STILL open after 5 minutes. Please check
            the entry.
          data:
            image: /local/door_alert_snapshot.jpg
            push:
              sound:
                name: default
                critical: 1
                volume: 1
    - conditions:
      - condition: trigger
        id: 10min
      sequence:
      - action: notify.mobile_app_julian
        data:
          title: "\U0001F6A8 Roller Door Still Open — 10 min"
          message: The front roller door is STILL open after 10 minutes — please attend
            the entry now.
          data:
            image: /local/door_alert_snapshot.jpg
            push:
              sound:
                name: default
                critical: 1
                volume: 1
  mode: queued
  max: 3
- id: keypad_validate_entry
  alias: Customer Keypad - Validate Entry & Open Door
  description: Customer entry keypad fires esphome.keypad_code with the typed PIN.
    Compare against active-booking codes in input_text.bay{N}_code_slot_{a/b/c}. Match
    -> unlock lock.front_door_lock + log. No match -> log. Fully self-contained templates
    (no inter-variable refs). See BUILD_KEYPAD_PATH_A_JAYCAR.md.
  triggers:
  - platform: event
    event_type: esphome.keypad_code
  actions:
  - condition: template
    value_template: '{{ ((trigger.event.data.pin | default('''') | string) | regex_replace(''[^0-9]'',
      '''')) | length >= 4 }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ match != '''' }}'
      sequence:
      - action: lock.unlock
        target:
          entity_id: lock.front_door_lock
      - action: logbook.log
        data:
          name: Keypad Entry
          message: Valid code — door opened for {{ match.split('|')[1] }} (Bay {{
            match.split('|')[0] }})
          entity_id: lock.front_door_lock
    default:
    - action: logbook.log
      data:
        name: Keypad Entry
        message: Invalid code attempt — door not opened
        entity_id: lock.front_door_lock
  - action: shell_command.entry_webhook
    data:
      code: '{{ (trigger.event.data.pin | default('''') | string) | regex_replace(''[^0-9]'','''')
        }}'
      result: '{{ ''valid'' if match != '''' else ''invalid'' }}'
      bay: '{{ match.split(''|'')[0] if match != '''' else '''' }}'
    continue_on_error: true
  mode: single
  variables:
    match: '{% set t = (trigger.event.data.pin | default('''') | string) | regex_replace(''[^0-9]'',
      '''') %}{% set ns = namespace(found='''') %}{% for n in range(1, 6) %}{% for
      s in [''a'', ''b'', ''c''] %}{% set val = states(''input_text.bay'' ~ n ~ ''_code_slot_''
      ~ s) %}{% if val and '':'' in val and (val.split('':'', 1)[0] | trim) == t and
      t != '''' %}{% set ns.found = n ~ ''|'' ~ val.split('':'', 1)[1] %}{% endif
      %}{% endfor %}{% endfor %}{{ ns.found }}'
- id: '1780392305276'
  alias: Zigbee - Low Battery Alert
  description: Notify Julian when a battery-powered Zigbee device drops below 50%
    (sustained 30 min to avoid a transient dip). Currently only the roller door contact
    has a battery; add new battery sensors here as devices are paired.
  triggers:
  - platform: numeric_state
    entity_id: sensor.0x54ef4410014ae72a_battery
    below: 50
    for:
      minutes: 30
  actions:
  - action: notify.mobile_app_julian
    data:
      title: Low battery - Roller door sensor
      message: Roller door contact sensor battery is at {{ states('sensor.0x54ef4410014ae72a_battery')
        }}%. Replace soon (CR2032).
  mode: single
- id: '1780392309960'
  alias: Zigbee - Device Offline Alert
  description: 'GENERIC - auto-covers ALL Zigbee/MQTT devices, no maintained list.
    Detects any device whose entities have gone ''unavailable'' (Z2M availability:
    active/router ~10 min, passive battery ~25 h) and notifies Julian with the device
    name(s). Whole-bridge-down flagged separately as a network outage. 5-min ''for''
    guards the brief unavailability during a Z2M restart. New devices are covered
    automatically.'
  triggers:
  - platform: template
    id: device
    for:
      minutes: 5
    value_template: '{% set ns = namespace(c=0) %}{% for e in integration_entities(''mqtt'')
      %}{% if states(e) == ''unavailable'' %}{% set nm = device_attr(e,''name_by_user'')
      or device_attr(e,''name'') %}{% if nm and nm != ''Zigbee2MQTT Bridge'' %}{%
      set ns.c = ns.c + 1 %}{% endif %}{% endif %}{% endfor %}{{ ns.c > 0 }}'
  - platform: time
    at: 09:05:00
    id: daily
  - platform: state
    entity_id: binary_sensor.zigbee2mqtt_bridge_connection_state
    to: 'off'
    for:
      minutes: 2
    id: bridge
  conditions:
  - condition: template
    value_template: '{% set ns = namespace(c=0) %}{% for e in integration_entities(''mqtt'')
      %}{% if states(e) == ''unavailable'' %}{% set nm = device_attr(e,''name_by_user'')
      or device_attr(e,''name'') %}{% if nm and nm != ''Zigbee2MQTT Bridge'' %}{%
      set ns.c = ns.c + 1 %}{% endif %}{% endif %}{% endfor %}{{ trigger.id == ''bridge''
      or ns.c > 0 }}'
  actions:
  - action: notify.mobile_app_julian
    data:
      title: '{{ ''Zigbee network DOWN'' if trigger.id == ''bridge'' else ''Zigbee
        device offline'' }}'
      message: '{% if trigger.id == ''bridge'' %}Zigbee2MQTT bridge has lost connection
        - all Zigbee devices are unreachable.{% else %}{% set ns = namespace(names=[])
        %}{% for e in integration_entities(''mqtt'') %}{% if states(e) == ''unavailable''
        %}{% set nm = device_attr(e,''name_by_user'') or device_attr(e,''name'') %}{%
        if nm and nm != ''Zigbee2MQTT Bridge'' and nm not in ns.names %}{% set ns.names
        = ns.names + [nm] %}{% endif %}{% endif %}{% endfor %}These Zigbee devices
        are offline: {{ ns.names | join('', '') }}{% endif %}'
  mode: queued
  max: 5
- id: '1780393541120'
  alias: Battery - Low Alert (wireless sensors)
  description: Generic low-battery alert for ALL wireless (MQTT/Zigbee) battery sensors.
    Auto-covers any new device - no per-device setup. Threshold from input_number.battery_low_alert_threshold
    (50%). Phones/watches (mobile_app) are excluded by the integration_entities('mqtt')
    scope. Fires on crossing below + a daily 09:00 backstop while still low.
  triggers:
  - platform: template
    value_template: '{% set t = states(''input_number.battery_low_alert_threshold'')|float(50)
      %}{{ (states.sensor | selectattr(''attributes.device_class'',''eq'',''battery'')
      | selectattr(''entity_id'',''in'', integration_entities(''mqtt'')) | map(attribute=''state'')
      | map(''float'',101) | select(''le'', t) | list | count) > 0 }}'
  - platform: time
    at: 09:00:00
  conditions:
  - condition: template
    value_template: '{% set t = states(''input_number.battery_low_alert_threshold'')|float(50)
      %}{{ (states.sensor | selectattr(''attributes.device_class'',''eq'',''battery'')
      | selectattr(''entity_id'',''in'', integration_entities(''mqtt'')) | map(attribute=''state'')
      | map(''float'',101) | select(''le'', t) | list | count) > 0 }}'
  actions:
  - action: notify.mobile_app_julian
    data:
      title: Low battery - wireless sensor
      message: '{% set t = states(''input_number.battery_low_alert_threshold'')|float(50)
        %}These wireless sensors are at/below {{ t|int }}%:{% for s in states.sensor
        | selectattr(''attributes.device_class'',''eq'',''battery'') | selectattr(''entity_id'',''in'',
        integration_entities(''mqtt'')) %}{% if s.state|float(101) <= t %}

        - {{ s.attributes.friendly_name }}: {{ s.state }}%{% endif %}{% endfor %}'
  mode: single
- id: '1780393546659'
  alias: Battery - Auto-onboard new wireless device
  description: When a NEW wireless (MQTT/Zigbee) battery sensor is added to HA, automatically
    record its install date (today) into input_text.battery_install_date_log_json
    and notify. Runs once per device (skips if already recorded). This is what makes
    battery tracking automatic from day of install. 1-min delay lets the entity initialise
    so device_class is readable.
  triggers:
  - platform: event
    event_type: entity_registry_updated
    event_data:
      action: create
  conditions:
  - condition: template
    value_template: '{{ trigger.event.data.entity_id is string and trigger.event.data.entity_id.startswith(''sensor.'')
      }}'
  actions:
  - delay:
      minutes: 1
  - choose:
    - conditions:
      - condition: template
        value_template: '{% set e = trigger.event.data.entity_id %}{% set raw = states(''input_text.battery_install_date_log_json'')
          %}{% set cur = (raw if raw not in [''unknown'',''unavailable'',''''] else
          ''{}'')|from_json %}{{ state_attr(e,''device_class'') == ''battery'' and
          e in integration_entities(''mqtt'') and e not in cur }}'
      sequence:
      - action: input_text.set_value
        target:
          entity_id: input_text.battery_install_date_log_json
        data:
          value: '{% set e = trigger.event.data.entity_id %}{% set raw = states(''input_text.battery_install_date_log_json'')
            %}{% set cur = (raw if raw not in [''unknown'',''unavailable'',''''] else
            ''{}'')|from_json %}{{ (cur | combine({e: now().strftime(''%Y-%m-%d'')}))
            | to_json }}'
      - action: notify.mobile_app_julian
        data:
          title: New wireless sensor onboarded
          message: '{% set e = trigger.event.data.entity_id %}{{ state_attr(e,''friendly_name'')
            or e }} detected and added to battery tracking (install date {{ now().strftime(''%d
            %b %Y'') }}). Low-battery alert at {{ states(''input_number.battery_low_alert_threshold'')|int(50)
            }}%.'
  mode: queued
  max: 10
- id: '1780396248413'
  alias: Fire Exit Door (WEST) - Opened Alert
  description: Immediate push to Julian + Noddy when the West fire exit opens. Live
    CCTV (camera.pier_facing_bags_cctv) attached - on iOS pull down the notification
    for live video; tapping opens the dedicated single-camera live view /fire-exit-west-cam/live.
    Time-sensitive so it breaks through silent/Focus. image= snapshot for Android.
  triggers:
  - platform: state
    entity_id: binary_sensor.0x54ef4410014ae8c0_contact
    from: 'off'
    to: 'on'
  actions:
  - action: notify.mobile_app_julian
    data:
      title: Fire Exit Door (WEST) OPENED
      message: Opened at {{ now().strftime('%-I:%M %p') }}. Tap for live CCTV.
      data:
        entity_id: camera.pier_facing_bags_cctv
        image: /api/camera_proxy/camera.pier_facing_bags_cctv
        url: /fire-exit-west-cam/live
        clickAction: /fire-exit-west-cam/live
        tag: fire-exit-west-open
        push:
          interruption-level: time-sensitive
        priority: high
        ttl: 0
  - action: notify.mobile_app_noddy_iphone
    data:
      title: Fire Exit Door (WEST) OPENED
      message: Opened at {{ now().strftime('%-I:%M %p') }}. Tap for live CCTV.
      data:
        entity_id: camera.pier_facing_bags_cctv
        image: /api/camera_proxy/camera.pier_facing_bags_cctv
        url: /fire-exit-west-cam/live
        clickAction: /fire-exit-west-cam/live
        tag: fire-exit-west-open
        push:
          interruption-level: time-sensitive
        priority: high
        ttl: 0
  mode: single
- id: refresh_upcoming_door_codes
  alias: Refresh Upcoming Door Codes
  description: Every 2 min (+ on HA start) fetches upcoming bookings from the 5 lane
    calendars and writes the chronological next-6 upcoming door codes into input_text.upcoming_door_code_1..6
    for the Door Codes dashboard. Built 2026-06-08.
  triggers:
  - platform: time_pattern
    minutes: /2
  - platform: homeassistant
    event: start
  actions:
  - condition: template
    value_template: '{{ [''calendar.lane_1_bowling_machine'',''calendar.lane_2_bowling_machine'',''calendar.lane_3_truman_or_bowling_machine'',''calendar.lane_4_run_up_net'',''calendar.lane_5_run_up_net'']
      | map(''states'') | reject(''in'', [''unavailable'',''unknown'','''']) | list
      | length == 5 }}'
  - action: calendar.get_events
    target:
      entity_id: calendar.lane_1_bowling_machine
    data:
      duration:
        hours: 30
    response_variable: ev1
  - action: calendar.get_events
    target:
      entity_id: calendar.lane_2_bowling_machine
    data:
      duration:
        hours: 30
    response_variable: ev2
  - action: calendar.get_events
    target:
      entity_id: calendar.lane_3_truman_or_bowling_machine
    data:
      duration:
        hours: 30
    response_variable: ev3
  - action: calendar.get_events
    target:
      entity_id: calendar.lane_4_run_up_net
    data:
      duration:
        hours: 30
    response_variable: ev4
  - action: calendar.get_events
    target:
      entity_id: calendar.lane_5_run_up_net
    data:
      duration:
        hours: 30
    response_variable: ev5
  - repeat:
      count: 6
      sequence:
      - action: input_text.set_value
        target:
          entity_id: input_text.upcoming_door_code_{{ repeat.index }}
        data:
          value: '{% set ns = namespace(items=[]) %}{% for e in ev1[''calendar.lane_1_bowling_machine''][''events'']
            %}{% if as_timestamp(e.start) > as_timestamp(now()) %}{% set ns.items
            = ns.items + [{''ts'': as_timestamp(e.start),''lane'':''Lane 1'',''desc'':e.description}]
            %}{% endif %}{% endfor %}{% for e in ev2[''calendar.lane_2_bowling_machine''][''events'']
            %}{% if as_timestamp(e.start) > as_timestamp(now()) %}{% set ns.items
            = ns.items + [{''ts'': as_timestamp(e.start),''lane'':''Lane 2'',''desc'':e.description}]
            %}{% endif %}{% endfor %}{% for e in ev3[''calendar.lane_3_truman_or_bowling_machine''][''events'']
            %}{% if as_timestamp(e.start) > as_timestamp(now()) %}{% set ns.items
            = ns.items + [{''ts'': as_timestamp(e.start),''lane'':''Lane 3'',''desc'':e.description}]
            %}{% endif %}{% endfor %}{% for e in ev4[''calendar.lane_4_run_up_net''][''events'']
            %}{% if as_timestamp(e.start) > as_timestamp(now()) %}{% set ns.items
            = ns.items + [{''ts'': as_timestamp(e.start),''lane'':''Lane 4'',''desc'':e.description}]
            %}{% endif %}{% endfor %}{% for e in ev5[''calendar.lane_5_run_up_net''][''events'']
            %}{% if as_timestamp(e.start) > as_timestamp(now()) %}{% set ns.items
            = ns.items + [{''ts'': as_timestamp(e.start),''lane'':''Lane 5'',''desc'':e.description}]
            %}{% endif %}{% endfor %}{% set s = ns.items | sort(attribute=''ts'')
            %}{% set i = (repeat.index | int) - 1 %}{% if i < (s | length) %}{% set
            it = s[i] %}{% set code = (it.desc | regex_findall(''DOOR CODE: ([0-9
            ]+)'') | first | default('''')) | replace('' '','''') %}{% set cust =
            (it.desc | regex_findall(''Customer: (.+)'') | first | default(''Guest''))
            | trim %}{{ it.ts | timestamp_custom(''%a %-I:%M %p'') }} :: {{ it.lane
            }} :: {{ code }} :: {{ cust }}{% endif %}'
  mode: single
- id: keypad_connection_monitor
  alias: Keypad - Connection Monitor (Critical)
  description: 'Door entry keypad (ESP32) connection to HA. OFFLINE >60s -> CRITICAL
    push to Julian that RE-RINGS every 30s until acknowledged (Acknowledge button)
    OR the keypad reconnects. Back ONLINE -> clears + normal push. mode restart so
    reconnect interrupts the ring loop. Updated 2026-06-10: Acknowledge now persists
    for the whole outage (removed the ack-reset that mode:restart wiped on every flap)
    and the re-ring stops within ~1s of tapping Acknowledge (wait_for_trigger instead
    of fixed 30s delay). Re-arms on reconnect, so a genuinely new offline episode
    still alerts.'
  triggers:
  - platform: state
    entity_id: sensor.cricket_keypad_uptime
    to: unavailable
    for: 00:01:00
    id: offline
  - platform: state
    entity_id: sensor.cricket_keypad_uptime
    from: unavailable
    id: online
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: offline
      sequence:
      - repeat:
          while:
          - condition: template
            value_template: '{{ not is_state(''binary_sensor.cricket_keypad_online'',''on'')
              }}'
          - condition: state
            entity_id: input_boolean.keypad_offline_alert_acknowledged
            state: 'off'
          sequence:
          - action: notify.mobile_app_julian
            data:
              title: "\U0001F6A8 DOOR KEYPAD OFFLINE"
              message: The entry keypad has lost connection to Home Assistant — customers
                may be unable to open the door. Check power/network at the door.
              data:
                push:
                  sound:
                    name: default
                    critical: 1
                    volume: 1
                tag: keypad_offline
                actions:
                - action: ACK_KEYPAD
                  title: Acknowledge
          - wait_for_trigger:
            - platform: state
              entity_id: input_boolean.keypad_offline_alert_acknowledged
              to: 'on'
            timeout: 00:00:30
            continue_on_timeout: true
    - conditions:
      - condition: trigger
        id: online
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.keypad_offline_alert_acknowledged
      - action: notify.mobile_app_julian
        data:
          message: clear_notification
          data:
            tag: keypad_offline
      - action: notify.mobile_app_julian
        data:
          title: ✅ Door keypad back online
          message: The entry keypad has reconnected to Home Assistant.
  mode: restart
- id: keypad_overheat_alert
  alias: Keypad - Chip Overheat Alert (Critical)
  description: 'ESP32 keypad chip overheat. >80C for 2min -> CRITICAL push to Julian
    that RE-RINGS every 30s until acknowledged (Acknowledge button) OR the chip cools
    below 75C. Cooled -> clears + normal push. mode restart. Threshold provisional
    pending baseline. Updated 2026-06-10: Acknowledge now persists for the whole hot
    spell (removed the ack-reset that mode:restart wiped on every re-trigger) and
    the re-ring stops within ~1s of tapping Acknowledge (wait_for_trigger instead
    of fixed 30s delay). Re-arms when cooled <75C, so a genuinely new overheat still
    alerts.'
  triggers:
  - platform: numeric_state
    entity_id: sensor.cricket_keypad_chip_temperature
    above: 80
    for: 00:02:00
    id: hot
  - platform: numeric_state
    entity_id: sensor.cricket_keypad_chip_temperature
    below: 75
    id: cooled
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: hot
      sequence:
      - repeat:
          while:
          - condition: numeric_state
            entity_id: sensor.cricket_keypad_chip_temperature
            above: 75
          - condition: state
            entity_id: input_boolean.keypad_overheat_alert_acknowledged
            state: 'off'
          sequence:
          - action: notify.mobile_app_julian
            data:
              title: "\U0001F6A8 Door keypad overheating"
              message: The entry keypad chip is running hot ({{ states('sensor.cricket_keypad_chip_temperature')
                }}°C). The door may fail. Check heat/ventilation at the enclosure.
              data:
                push:
                  sound:
                    name: default
                    critical: 1
                    volume: 1
                tag: keypad_overheat
                actions:
                - action: ACK_KEYPAD_HEAT
                  title: Acknowledge
          - wait_for_trigger:
            - platform: state
              entity_id: input_boolean.keypad_overheat_alert_acknowledged
              to: 'on'
            timeout: 00:00:30
            continue_on_timeout: true
    - conditions:
      - condition: trigger
        id: cooled
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.keypad_overheat_alert_acknowledged
      - action: notify.mobile_app_julian
        data:
          message: clear_notification
          data:
            tag: keypad_overheat
      - action: notify.mobile_app_julian
        data:
          title: ✅ Keypad cooled down
          message: The keypad chip temperature is back to normal ({{ states('sensor.cricket_keypad_chip_temperature')
            }}°C).
  mode: restart
- id: keypad_offline_ack_handler
  alias: Keypad - Offline Alert Acknowledged
  description: Julian taps Acknowledge on the offline critical alert -> silence the
    re-ring loop (sets the ack flag), clears the notification, and confirms. Built
    2026-06-08.
  triggers:
  - platform: event
    event_type: mobile_app_notification_action
    event_data:
      action: ACK_KEYPAD
  actions:
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.keypad_offline_alert_acknowledged
  - action: notify.mobile_app_julian
    data:
      message: clear_notification
      data:
        tag: keypad_offline
  - action: notify.mobile_app_julian
    data:
      title: Keypad alert acknowledged
      message: Re-alert silenced. Keypad still offline — it will auto-clear when it
        reconnects.
  mode: single
- id: keypad_overheat_ack_handler
  alias: Keypad - Overheat Alert Acknowledged
  description: Julian taps Acknowledge on the overheat critical alert -> silence the
    re-ring loop (sets the overheat ack flag), clears the notification, confirms.
    Built 2026-06-08.
  triggers:
  - platform: event
    event_type: mobile_app_notification_action
    event_data:
      action: ACK_KEYPAD_HEAT
  actions:
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.keypad_overheat_alert_acknowledged
  - action: notify.mobile_app_julian
    data:
      message: clear_notification
      data:
        tag: keypad_overheat
  - action: notify.mobile_app_julian
    data:
      title: Overheat alert acknowledged
      message: Re-alert silenced. Chip still hot — it will auto-clear when it cools
        down.
  mode: single
- id: reminder_cricketrevolution_domain_renewal_2028
  alias: Reminder - Cricket Revolution domain renewal (1 Sep 2028)
  description: 'Calendar reminder set for 1 Sep 2028: the cricketrevolution.com.au
    website/domain registration EXPIRES 13 Oct 2028. From 1 Sep 2028 onward it fires
    DAILY at 09:00 (+ on HA start) and keeps nagging until the domain is confirmed
    re-registered (input_boolean.cricketrevolution_domain_renewed -> on, via the "Mark
    as registered" button on the phone alert or the helper toggle). Each run re-asserts
    a persistent notification in the HA web UI and pushes a time-sensitive alert to
    Julian + Noddy''s phones. Built 2026-06-08.'
  triggers:
  - platform: time
    at: 09:00:00
  - platform: homeassistant
    event: start
  conditions:
  - condition: state
    entity_id: input_boolean.cricketrevolution_domain_renewed
    state: 'off'
  - condition: template
    value_template: '{{ now().date() >= strptime(''2028-09-01'',''%Y-%m-%d'').date()
      }}'
  actions:
  - action: persistent_notification.create
    data:
      notification_id: cricketrevolution_domain_renewal_2028
      title: 'Domain renewal due: cricketrevolution.com.au'
      message: '{% set e = strptime(''2028-10-13'',''%Y-%m-%d'').date() %}{% set d
        = (e - now().date()).days %}The cricketrevolution.com.au website/domain registration
        EXPIRES on 13 Oct 2028 ({% if d >= 0 %}{{ d }} day(s) left{% else %}EXPIRED
        {{ -d }} day(s) ago{% endif %}). Renew it so the site stays online, then tap
        "Mark as registered" on the phone alert (or toggle the "Cricket Revolution
        domain renewed" helper) to stop these daily reminders. https://www.cricketrevolution.com.au'
  - action: notify.mobile_app_julian
    data:
      title: 'Domain renewal due: cricketrevolution.com.au'
      message: '{% set e = strptime(''2028-10-13'',''%Y-%m-%d'').date() %}{% set d
        = (e - now().date()).days %}cricketrevolution.com.au registration {% if d
        >= 0 %}EXPIRES 13 Oct 2028 — {{ d }} day(s) left{% else %}EXPIRED on 13 Oct
        2028 — {{ -d }} day(s) ago{% endif %}. Renew it, then tap "Mark as registered"
        to stop these daily reminders.'
      data:
        tag: cricketrevolution-domain-renewal
        url: https://www.cricketrevolution.com.au
        clickAction: https://www.cricketrevolution.com.au
        actions:
        - action: CONFIRM_DOMAIN_RENEWED
          title: Mark as registered
        push:
          interruption-level: time-sensitive
        priority: high
  - action: notify.mobile_app_noddy_iphone
    data:
      title: 'Domain renewal due: cricketrevolution.com.au'
      message: '{% set e = strptime(''2028-10-13'',''%Y-%m-%d'').date() %}{% set d
        = (e - now().date()).days %}cricketrevolution.com.au registration {% if d
        >= 0 %}EXPIRES 13 Oct 2028 — {{ d }} day(s) left{% else %}EXPIRED on 13 Oct
        2028 — {{ -d }} day(s) ago{% endif %}. Renew it, then tap "Mark as registered"
        to stop these daily reminders.'
      data:
        tag: cricketrevolution-domain-renewal
        url: https://www.cricketrevolution.com.au
        clickAction: https://www.cricketrevolution.com.au
        actions:
        - action: CONFIRM_DOMAIN_RENEWED
          title: Mark as registered
        push:
          interruption-level: time-sensitive
        priority: high
  mode: single
- id: cricketrevolution_domain_renewed_action
  alias: Reminder - Cricket Revolution domain confirmed (phone button)
  description: Julian/Noddy taps "Mark as registered" on the domain-renewal alert
    -> flips input_boolean.cricketrevolution_domain_renewed on; the cleanup automation
    then stops the daily reminders. Built 2026-06-08.
  triggers:
  - platform: event
    event_type: mobile_app_notification_action
    event_data:
      action: CONFIRM_DOMAIN_RENEWED
  actions:
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.cricketrevolution_domain_renewed
  mode: single
- id: cricketrevolution_domain_renewed_cleanup
  alias: Reminder - Cricket Revolution domain renewed (stop reminders)
  description: When input_boolean.cricketrevolution_domain_renewed turns on (phone
    button or helper toggle), dismiss the persistent notification, clear the phone
    alerts on both devices, and confirm. Stops the daily domain-renewal reminders.
    Built 2026-06-08.
  triggers:
  - platform: state
    entity_id: input_boolean.cricketrevolution_domain_renewed
    to: 'on'
  actions:
  - action: persistent_notification.dismiss
    data:
      notification_id: cricketrevolution_domain_renewal_2028
  - action: notify.mobile_app_julian
    data:
      message: clear_notification
      data:
        tag: cricketrevolution-domain-renewal
  - action: notify.mobile_app_noddy_iphone
    data:
      message: clear_notification
      data:
        tag: cricketrevolution-domain-renewal
  - action: notify.mobile_app_julian
    data:
      title: Domain renewal confirmed
      message: cricketrevolution.com.au marked as re-registered — daily reminders
        stopped.
  mode: single
- id: lighting_all_lanes_on_busy_evening
  alias: Lighting - All Lanes On (Busy Evening)
  description: From the evening start (input_datetime.lighting_all_lanes_evening_start,
    default 4:00 PM) until the absolute catch-all time, when a booking begins (using
    the same 11-min lead-in as the per-bay starts) or on a 10-min re-check, if the
    evening's PEAK CONCURRENT bookings reaches the threshold (input_number.lighting_all_lanes_min_concurrent,
    default 3) it floods ALL 5 lane highbays on and latches busy mode. They stay on
    (re-asserted by 'All Lanes Keep-On') until the last booking ends, when the night
    staggered shutdown (or the daylight-end automation) takes over and clears the
    latch. Built 2026-06-08.
  triggers:
  - platform: calendar
    event: start
    entity_id: calendar.lane_1_bowling_machine
    offset: -0:11:00
    id: booking
  - platform: calendar
    event: start
    entity_id: calendar.lane_2_bowling_machine
    offset: -0:11:00
    id: booking
  - platform: calendar
    event: start
    entity_id: calendar.lane_3_truman_or_bowling_machine
    offset: -0:11:00
    id: booking
  - platform: calendar
    event: start
    entity_id: calendar.lane_4_run_up_net
    offset: -0:11:00
    id: booking
  - platform: calendar
    event: start
    entity_id: calendar.lane_5_run_up_net
    offset: -0:11:00
    id: booking
  - platform: time_pattern
    minutes: /10
    id: recheck
  conditions:
  - condition: state
    entity_id: input_boolean.lighting_all_lanes_active
    state: 'off'
  - condition: template
    value_template: '{% set cutoff = strptime(states(''input_datetime.lighting_all_lanes_evening_start''),''%H:%M:%S'').time()
      %} {% set hardoff = strptime(states(''input_datetime.lighting_hard_off_catchall''),''%H:%M:%S'').time()
      %} {% if trigger.id == ''booking'' %} {{ as_local(as_datetime(trigger.calendar_event.start)).time()
      >= cutoff and now().time() < hardoff }} {% else %} {% set on = expand(''calendar.lane_1_bowling_machine'',''calendar.lane_2_bowling_machine'',''calendar.lane_3_truman_or_bowling_machine'',''calendar.lane_4_run_up_net'',''calendar.lane_5_run_up_net'')
      | selectattr(''state'',''eq'',''on'') | list | count %} {{ now().time() >= cutoff
      and now().time() < hardoff and on > 0 }} {% endif %}'
  actions:
  - action: calendar.get_events
    target:
      entity_id:
      - calendar.lane_1_bowling_machine
      - calendar.lane_2_bowling_machine
      - calendar.lane_3_truman_or_bowling_machine
      - calendar.lane_4_run_up_net
      - calendar.lane_5_run_up_net
    data:
      start_date_time: '{{ today_at(states(''input_datetime.lighting_all_lanes_evening_start''))
        }}'
      end_date_time: '{{ today_at(''23:59:59'') }}'
    response_variable: lane_events
  - if:
    - condition: template
      value_template: '{% set cutoff = as_timestamp(today_at(states(''input_datetime.lighting_all_lanes_evening_start'')))
        %} {% set ns = namespace(iv=[]) %} {% for cal, d in lane_events.items() %}{%
        for ev in d.events %}{% set ns.iv = ns.iv + [(as_timestamp(as_datetime(ev.start)),
        as_timestamp(as_datetime(ev.end)))] %}{% endfor %}{% endfor %} {% set p =
        namespace(instants=[cutoff], peak=0) %} {% for s, e in ns.iv %}{% if s >=
        cutoff %}{% set p.instants = p.instants + [s] %}{% endif %}{% endfor %} {%
        for t in p.instants %}{% set c = namespace(n=0) %}{% for s, e in ns.iv %}{%
        if s <= t and t < e %}{% set c.n = c.n + 1 %}{% endif %}{% endfor %}{% if
        c.n > p.peak %}{% set p.peak = c.n %}{% endif %}{% endfor %} {{ p.peak >=
        (states(''input_number.lighting_all_lanes_min_concurrent'') | int(3)) }}'
    then:
    - action: light.turn_on
      target:
        entity_id:
        - light.highbay_1
        - light.highbay_2
        - light.highbay_3
        - light.highbay_4
        - light.highbay_5
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.lighting_all_lanes_active
  mode: single
- id: lighting_all_lanes_keep_on
  alias: Lighting - All Lanes Keep-On (re-assert)
  description: While busy mode is latched, if any lane highbay gets switched off (e.g.
    by a per-bay END automation as bookings finish), switch it straight back on so
    all lane lights stay on until the last booking ends. The night staggered shutdown,
    the daylight-end automation and the absolute catch-all all clear the latch FIRST,
    so they are not fought. Built 2026-06-08.
  triggers:
  - platform: state
    entity_id:
    - light.highbay_1
    - light.highbay_2
    - light.highbay_3
    - light.highbay_4
    - light.highbay_5
    to: 'off'
  conditions:
  - condition: state
    entity_id: input_boolean.lighting_all_lanes_active
    state: 'on'
  actions:
  - action: light.turn_on
    target:
      entity_id: '{{ trigger.entity_id }}'
  mode: parallel
  max: 5
- id: lighting_all_lanes_end_daylight
  alias: Lighting - All Lanes Mode End (Daylight)
  description: 'Busy-mode safety for the rare case the last booking ends while it''s
    still daylight (before sunset-30m): clear the busy-mode latch FIRST (so Keep-On
    stops), then turn all lane highbays off. The after-dark case is handled by ''Night
    - All Off + Highbay 3 Residual''. Built 2026-06-08.'
  triggers:
  - platform: state
    entity_id:
    - input_boolean.bay1_helper
    - input_boolean.bay2_helper
    - input_boolean.bay3_helper
    - input_boolean.bay4_helper
    - input_boolean.bay5_helper
    to: 'off'
  conditions:
  - condition: state
    entity_id: input_boolean.lighting_all_lanes_active
    state: 'on'
  - condition: state
    entity_id:
    - input_boolean.bay1_helper
    - input_boolean.bay2_helper
    - input_boolean.bay3_helper
    - input_boolean.bay4_helper
    - input_boolean.bay5_helper
    state: 'off'
  - condition: not
    conditions:
    - condition: sun
      after: sunset
      after_offset: -00:30:00
  actions:
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.lighting_all_lanes_active
  - action: light.turn_off
    target:
      entity_id:
      - light.highbay_1
      - light.highbay_2
      - light.highbay_3
      - light.highbay_4
      - light.highbay_5
  mode: single
- id: '1781066813073'
  alias: Google Calendar - Fast Sync (lanes, every 2 min)
  description: Forces an incremental Google Calendar sync on the 5 lane calendars
    every 2 minutes (HA's native Google poll is a hardcoded 15 min). Cuts the lag
    between a Krickora booking/extension being written to Google Calendar and HA seeing
    it, so door codes load in time for near-start bookings. Operating hours only to
    avoid pointless overnight API calls.
  triggers:
  - platform: time_pattern
    minutes: /2
  conditions:
  - condition: time
    after: 05:00:00
    before: '23:00:00'
  actions:
  - action: homeassistant.update_entity
    target:
      entity_id:
      - calendar.lane_1_bowling_machine
      - calendar.lane_2_bowling_machine
      - calendar.lane_3_truman_or_bowling_machine
      - calendar.lane_4_run_up_net
      - calendar.lane_5_run_up_net
  mode: single
- id: '1781517514481'
  alias: Control4 - Connection Watchdog (auto-reload on dead feed)
  description: 'Detects a dead Control4 Director feed (websocket/poll drop that freezes
    ALL Control4 entity states - e.g. lights showing OFF while physically ON, as happened
    2026-06-15 ~13:00). Active liveness probe every 2 min: force homeassistant.update_entity
    on two Control4 probe entities, wait 15s, then check whether they refreshed. If
    neither refreshed (>90s stale) or both unavailable, the Director feed is dead
    -> reload_config_entry on the Control4 entry (entry_id 01KM09V3X1JDWRBA7KSWMD1WAJ)
    to resync, and push Julian ONCE per episode (throttled via input_boolean.control4_feed_down)
    + a recovery push when it comes back. The integration is already on the latest
    version (1.7.0); reload is the only fix. Probe-refresh-on-healthy confirmed via
    update_entity 2026-06-15. Built 2026-06-15 -> BUILD_HA_2026-06-15.'
  triggers:
  - trigger: time_pattern
    minutes: /2
  actions:
  - action: homeassistant.update_entity
    continue_on_error: true
    data:
      entity_id:
      - sensor.non_dimmable_light_centralized_power
      - light.highbay_3
  - delay: 00:00:15
  - choose:
    - conditions:
      - condition: template
        value_template: '{% set probes = [''sensor.non_dimmable_light_centralized_power'',''light.highbay_3'']
          %}{% set ns = namespace(healthy=false) %}{% for p in probes %}{% set st
          = states(p) %}{% set lr = as_timestamp(states[p].last_reported) %}{% if
          st not in [''unavailable'',''unknown''] and lr and (as_timestamp(now())
          - lr) < 90 %}{% set ns.healthy = true %}{% endif %}{% endfor %}{{ not ns.healthy
          }}'
      sequence:
      - action: homeassistant.reload_config_entry
        data:
          entry_id: 01KM09V3X1JDWRBA7KSWMD1WAJ
      - if:
        - condition: state
          entity_id: input_boolean.control4_feed_down
          state: 'off'
        then:
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.control4_feed_down
        - action: notify.mobile_app_julian
          data:
            title: ⚠️ Control4 feed stale - auto-reloaded
            message: HA lost live state from the Control4 Director (lights/locks would
              show wrong state). Auto-reloaded the Control4 integration to resync.
              If this keeps repeating, check the Director (192.168.1.107) and the
              HA<->C4 network link.
            data:
              tag: control4_feed_down
    default:
    - if:
      - condition: state
        entity_id: input_boolean.control4_feed_down
        state: 'on'
      then:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.control4_feed_down
      - action: notify.mobile_app_julian
        data:
          message: clear_notification
          data:
            tag: control4_feed_down
      - action: notify.mobile_app_julian
        data:
          title: ✅ Control4 feed recovered
          message: HA is receiving live Control4 state again (auto-reload worked).
  mode: single
